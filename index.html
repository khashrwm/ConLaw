<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constitutional Law — MC Practice Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1117;--surface:#181b24;--surface2:#1f2330;--border:#2a2e3b;
    --text:#e2e4ea;--text-muted:#8b90a0;--accent:#6c8cff;--accent-dim:#3a4d8c;
    --correct:#34d399;--correct-bg:rgba(52,211,153,.08);
    --wrong:#f87171;--wrong-bg:rgba(248,113,113,.08);
    --radius:10px;
  }
  html{font-size:16px;scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Source Serif 4',Georgia,serif;line-height:1.7;
    min-height:100vh;
  }
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;opacity:.03;
    background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .hero{
    text-align:center;padding:4rem 1.5rem 2.5rem;
    background:linear-gradient(175deg,#151825 0%,#0f1117 100%);
    border-bottom:1px solid var(--border);position:relative;overflow:hidden;
  }
  .hero::before{
    content:'';position:absolute;top:-40%;left:50%;transform:translateX(-50%);
    width:600px;height:600px;border-radius:50%;
    background:radial-gradient(circle,rgba(108,140,255,.1) 0%,transparent 70%);
    pointer-events:none;
  }
  .hero h1{
    font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(2rem,5vw,3.2rem);
    letter-spacing:-.02em;line-height:1.15;margin-bottom:.5rem;position:relative;
    background:linear-gradient(135deg,#e2e4ea 30%,#6c8cff 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .hero p{color:var(--text-muted);font-size:1.05rem;max-width:520px;margin:0 auto;}
  .score-strip{
    position:sticky;top:0;z-index:100;
    background:rgba(15,17,23,.85);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    display:flex;justify-content:center;gap:2rem;padding:.75rem 1rem;
    font-family:'JetBrains Mono',monospace;font-size:.85rem;
  }
  .score-strip span{display:flex;align-items:center;gap:.35rem}
  .score-strip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot-correct{background:var(--correct)}.dot-wrong{background:var(--wrong)}.dot-total{background:var(--accent)}
  .container{max-width:760px;margin:0 auto;padding:1.5rem 1.25rem 6rem}
  .class-divider{
    margin:3rem 0 1.5rem;padding:.6rem 1rem;
    font-family:'Playfair Display',serif;font-weight:700;font-size:1.25rem;
    color:var(--accent);border-left:3px solid var(--accent);
    background:linear-gradient(90deg,rgba(108,140,255,.06),transparent 60%);
    border-radius:0 var(--radius) var(--radius) 0;
  }
  .q-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:1.5rem;margin-bottom:1.25rem;
    transition:border-color .3s;
  }
  .q-card.answered-correct{border-color:var(--correct)}
  .q-card.answered-wrong{border-color:var(--wrong)}
  .q-num{
    font-family:'JetBrains Mono',monospace;font-size:.75rem;
    color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;
  }
  .q-text{font-size:1.02rem;margin-bottom:1.15rem;line-height:1.75}
  .options{display:flex;flex-direction:column;gap:.5rem}
  .opt-btn{
    background:var(--surface2);border:1px solid var(--border);
    border-radius:8px;padding:.75rem 1rem;text-align:left;
    color:var(--text);font-family:'Source Serif 4',serif;font-size:.95rem;
    cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:.6rem;
    line-height:1.6;
  }
  .opt-btn:hover:not(.locked){background:#252937;border-color:#3a3f52}
  .opt-btn.selected{background:#252937;border-color:var(--accent)}
  .opt-btn.selected .letter{background:var(--accent);color:#0f1117}
  .opt-btn .letter{
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:.8rem;
    min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    border-radius:6px;background:var(--border);color:var(--text-muted);flex-shrink:0;
    margin-top:2px;transition:all .2s;
  }
  .opt-btn.selected-correct{background:var(--correct-bg);border-color:var(--correct)}
  .opt-btn.selected-correct .letter{background:var(--correct);color:#0f1117}
  .opt-btn.selected-wrong{background:var(--wrong-bg);border-color:var(--wrong)}
  .opt-btn.selected-wrong .letter{background:var(--wrong);color:#0f1117}
  .opt-btn.reveal-correct{border-color:var(--correct);opacity:.7}
  .opt-btn.reveal-correct .letter{background:var(--correct);color:#0f1117}
  .opt-btn.locked{cursor:default;opacity:.55}
  .opt-btn.locked.selected-correct,.opt-btn.locked.selected-wrong,.opt-btn.locked.reveal-correct{opacity:1}

  .submit-row{margin-top:.85rem;display:flex;align-items:center;gap:.75rem}
  .submit-btn{
    background:var(--accent);color:#0f1117;border:none;
    padding:.5rem 1.4rem;border-radius:8px;font-family:'JetBrains Mono',monospace;
    font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;
  }
  .submit-btn:hover{background:#8aa4ff}
  .submit-btn:disabled{opacity:.35;cursor:default;background:var(--accent-dim)}

  .feedback{
    padding:.6rem .9rem;border-radius:8px;font-size:.9rem;
    font-family:'JetBrains Mono',monospace;display:none;
  }
  .feedback.show{display:inline-block}
  .feedback.correct-fb{background:var(--correct-bg);color:var(--correct)}
  .feedback.wrong-fb{background:var(--wrong-bg);color:var(--wrong)}

  .bottom-bar{
    position:fixed;bottom:0;left:0;right:0;
    background:rgba(15,17,23,.9);backdrop-filter:blur(12px);
    border-top:1px solid var(--border);padding:.8rem;text-align:center;
  }
  .reset-btn{
    background:var(--accent-dim);color:#fff;border:none;
    padding:.55rem 1.6rem;border-radius:8px;font-family:'JetBrains Mono',monospace;
    font-size:.85rem;cursor:pointer;transition:background .2s;
  }
  .reset-btn:hover{background:var(--accent)}
  @media(max-width:600px){
    .container{padding:1rem .75rem 5rem}
    .q-card{padding:1.1rem}
    .hero{padding:2.5rem 1rem 1.5rem}
    .score-strip{gap:1rem;font-size:.75rem}
  }
</style>
</head>
<body>
<div class="hero">
  <h1>Constitutional Law MC Quiz</h1>
  <p>All multiple-choice questions from your class assignments. Select an answer, then hit Submit to check.</p>
</div>
<div class="score-strip">
  <span><span class="dot dot-correct"></span> Correct: <strong id="sCorrect">0</strong></span>
  <span><span class="dot dot-wrong"></span> Wrong: <strong id="sWrong">0</strong></span>
  <span><span class="dot dot-total"></span> Remaining: <strong id="sRemain">0</strong></span>
</div>
<div class="container" id="quizContainer"></div>

<script>
const questions = [
  // ─── CLASS 3 ───
  { cls:"Class 3", qLabel:"Q1",
    text:`President Trump just signed into law the federal No Teacher Tenure Act, which provides that school districts no longer needed to recognize the tenure of elementary school teachers\u2014all tenured teachers would lose their status and would be treated the same as non-tenured teachers. Under the NTTA, all tenured teachers may be fired for inadequate performance much more easily than before. In addition, it allows tenured teachers\u2019 salaries to be lowered, at least until a new contract with the teachers can be negotiated. The law has a 2 year grace period before it takes effect, to give schools and teachers time to adjust to the law; however, it specifically provided that once it is in effect, school board actions under the law supersede any existing contract terms.\n\nPlainfield Public School District is in the first year of a 3 year union contract with its teachers. The school board has stated that it plans to abolish tenured positions as soon as the law takes effect. The union believes that, once the NTTA takes effect, it will invalidate numerous terms of the union contract. Thus, the union filed an action in federal court on behalf of the teachers, asking for an injunction to prevent the school board from abolishing tenured positions and for a declaratory judgment stating that the law is invalid.\n\nShould the federal court hear the case?`,
    opts:[
      "Yes, because the federal law encourages improper interference with a contract.",
      "No, because the union does not have standing to sue on behalf of the teachers.",
      "No, because a ruling on the law at this point is premature.",
      "Yes, because the teachers\u2019 rights and benefits are threatened by the law and the school board\u2019s stated plans."
    ], ans:2 },

  // ─── CLASS 8 ───
  { cls:"Class 8", qLabel:"Q1",
    text:`Congress authorized $15 million to go to Nebraska and neighboring states that had reported outbreaks of a serious virus spread via a locust infestation. The states were required to use the money for spraying to eradicate locust larva. Under the law, all federal environmental protection funding to the states would be contingent on state implementation of the spraying program. In Nebraska, federal environmental protection funding constituted about 1.2 % of the state\u2019s budget. Nebraska determined that the chemical spray could have negative environmental consequences and refused to implement the program. Consequently, the federal government terminated all of the Nebraska\u2019s environmental protection funding. Nebraska filed an action to force the federal government to continue to provide funding for its other environmental protection projects unrelated to the locust-spraying program.\n\nWho will most likely prevail?`,
    opts:[
      "The federal government, because depriving Nebraska of federal funding amounting to less than 2% of the state\u2019s budget is not unduly coercive.",
      "The federal government, because controlling locust populations in multiple states is a valid regulation of interstate commerce.",
      "Nebraska, because controlling locust populations is not a regulation of interstate commerce.",
      "Nebraska, because Congress may not use its spending power to coerce states into implementing federal programs."
    ], ans:0 },
  { cls:"Class 8", qLabel:"Q2",
    text:`Due to budget shortages and a critical need of funding to offset the costs of the global health crisis, Congress enacted a $30 tax on each person flying into an airport in the seven most popular vacation destinations in the country, as determined by Congress. Fearing that the number of vacationers to the taxed destinations would decrease due to the tax, officials in the seven destinations wanted to challenge the legislation after Congress implemented the tax.\n\nIf an official with standing challenges the tax, is it likely that the tax is found constitutional?`,
    opts:[
      "Yes, because Congress has plenary power to impose taxes to raise revenue.",
      "Yes, because the tax is necessary to achieve a compelling government interest.",
      "No, because the tax unfairly discriminates against certain vacation destinations by taxing them and not taxing other, similar vacation destinations.",
      "No, because it makes it significantly more difficult for persons to travel between the states."
    ], ans:0 },
  { cls:"Class 8", qLabel:"Q3",
    text:`Congress provided by statute that any state that does not enact a ban on texting while driving on state highways within the next 4 years shall be denied 20% of federal highway construction funding.\n\nWhat is the best argument that can be made in support of the constitutionality of this federal statute?`,
    opts:[
      "The requirement is not unduly coercive and is related to making travel on highways safer.",
      "A recent public opinion survey demonstrates that 90% of the people in this country support the ban.",
      "The states ceded their authority over highways to the national government when the states accepted federal grants to help finance the highways.",
      "The federal government can regulate the use of state highways without limitation because the federal government paid for most of their construction costs."
    ], ans:0 },
  { cls:"Class 8", qLabel:"Q4",
    text:`Congress enacted Save Our Bobcats Act (\u201cSOBA\u201d) that imposed criminal penalties for killing bobcats, as Congress determined they are important to the tourism industry in certain regions of the country. However, California classified bobcats as varmint that may be destroyed by anyone with a general hunting license. A California farmer who possessed a valid state general hunting license regularly shot and killed bobcats that ate her chickens.\n\nIf the farmer is prosecuted under SOBA and challenges its constitutionality, which of the following is the strongest constitutional argument in support of SOBA?`,
    opts:[
      "The commerce power",
      "The police power.",
      "The Necessary and Proper Clause.",
      "The power to regulate federal lands."
    ], ans:0 },

  // ─── CLASS 9 ───
  { cls:"Class 9", qLabel:"Q1",
    text:`At a meeting with some of her advisors, the President lost her temper. She vehemently and falsely criticized a position paper prepared by an aide with whom she had had an affair just before she was elected President. She fired the aide and told him he would never work in government again \u201cexcept maybe in the mailroom.\u201d The outrageous remarks caused the aide severe emotional distress. He sued for intentional infliction of emotional distress.\n\nIf the President moved to dismiss, what would be the most important criterion that the court would use to decide the motion?`,
    opts:[
      "Whether the President\u2019s actions were predicated on her official acts.",
      "Whether the President\u2019s affair with a subordinate constituted a crime.",
      "Whether the President would be hampered in the conduct of her official duties in defending the lawsuit.",
      "Whether the separation of powers doctrine is served by postponing the case until the President left office."
    ], ans:0 },
  { cls:"Class 9", qLabel:"Q2",
    text:`Following a series of terrorist attacks in a foreign country in which several Americans were held hostage, the President issued an executive order to cut off all diplomatic ties, including prohibiting most trade agreements. The executive order required the closure of the country\u2019s embassy and the removal of its consul from the United States. The country\u2019s Prime Minister, which imports billions of dollars of goods from the United States each year, threatened to stop all U.S. imports immediately unless the embassy was reopened and the consul reinstated. The consul brought an action against the United States in federal district court to enjoin enforcement of the President\u2019s action.\n\nWill the court hear the case?`,
    opts:[
      "No, because Article II gives the President exclusive authority to recognize foreign governments.",
      "No, because lower federal courts lack original jurisdiction over cases involving ambassadors and consuls.",
      "Yes, because the consul has suffered redressable harm.",
      "Yes, because the President\u2019s action usurps the power of Congress to regulate issues directly or indirectly affecting foreign commerce."
    ], ans:0 },
  { cls:"Class 9", qLabel:"Q3",
    text:`In the famous Steel Seizure case, which of the following was not part of the majority or concurring opinions regarding President Truman\u2019s authority?`,
    opts:[
      "The Executive has unfettered authority.",
      "The Executive\u2019s power is at its lowest ebb when acting against the will of Congress.",
      "The Executive\u2019s power is at its height when acting with the support of Congress.",
      "There is a \u201czone of twilight\u201d where the Court must view events to determine whether Congress supported the Executive\u2019s action."
    ], ans:0 },

  // ─── CLASS 10 ───
  { cls:"Class 10", qLabel:"Q1",
    text:`Congress approved an act that contained an appropriation of $2 million for Wyoming State University Professor Pat Pruitt to study the effects of oil drilling on the elk population in the Pacific Northwest. The bill contained a second appropriation of $1 million for a Hawaii State University Professor Jo Jackson to study the effects of volcanoes on sea levels. The President drew a line through the first appropriation, with the intent of canceling the provision, and then signed the bill. The professor studying oil drilling brought suit alleging that the action of the President was unconstitutional and therefore the striking of the appropriation invalid.\n\nWas the President\u2019s action constitutional?`,
    opts:[
      "No, because the President has no line item veto power.",
      "No, because the President may not veto an appropriation passed by Congress.",
      "Yes, because the President could have vetoed the appropriation if it were contained in a separate bill.",
      "Yes, because the President has the power to refuse to spend funds that have been appropriated unless the spending is specifically mandated."
    ], ans:0 },
  { cls:"Class 10", qLabel:"Q2",
    text:`The federal Stop Terrorism Act authorized President A to designate countries as state sponsors of terrorism and impose economic sanctions on them. When President B took office, he declared numerous traditional U.S. allies state sponsors of terrorism and imposed sanctions on them. In response, Congress passed a joint resolution, identifying many of the allies as non-sponsors of terrorism and reinstating previously existing trade agreements with those countries.\n\nIf President B seeks to enforce the sanctions, are they valid?`,
    opts:[
      "Yes, because the President did not sign the joint resolution.",
      "No, because presidential economic power is at its lowest ebb when its use conflicts with the will of Congress.",
      "Yes, because Congress has the power to regulate domestic commerce, but not foreign commerce.",
      "No, because Congress has exclusive power to regulate commerce with foreign nations."
    ], ans:0 },

  // ─── CLASS 11 ───
  { cls:"Class 11", qLabel:"Q2",
    text:`A city ordinance requires its mayor to have been a resident of the city for at least five years at the time of taking office. A candidate who is thinking about running for mayor in an election that will take place next year will have been a resident for only four and one-half years at the time he would take office. Before he decides whether to run, the candidate wants to know whether he could lawfully assume the position if elected. The candidate filed suit in the local federal district court for a declaratory judgment that the five-year residence requirement is unconstitutional. He named the chairman of his political party as the sole defendant but did not join any election official. The chairman responded by joining the candidate in requesting that the court declare the residence requirement invalid.\n\nWhich of the following best reflects the action the court should take?`,
    opts:[
      "Refuse to determine the merits of this suit, because there is no case or controversy.",
      "Refuse to issue the declaratory judgment, because an issue of this kind involving only a local election does not present a substantial federal constitutional question.",
      "Issue the declaratory judgment, because the candidate will have substantially complied with the residency requirement.",
      "No answer text provided."
    ], ans:0 },
  { cls:"Class 11", qLabel:"Q6",
    text:`The Vice President conspired with various Pentagon and CIA officials to sell military weapons to a foreign country. When the President learned of these activities, he launched a full-scale investigation into the matter. The President presented his findings to Congress. The House of Representatives, by a one-vote majority, voted to impeach the Vice President. The Senate, by a one-vote majority, voted to remove the Vice President from office.\n\nIf the Vice President refuses to leave office, what is her best argument for retaining her position?`,
    opts:[
      "The Senate did not have enough votes to convict her.",
      "Only the President, not the Vice President, may be impeached.",
      "A two-thirds vote of both Houses of Congress is required to convict.",
      "The Senate, not the House of Representatives, is the appropriate body to impeach an executive officer."
    ], ans:0 },

  // ─── CLASS 12 ───
  { cls:"Class 12", qLabel:"Q1",
    text:`Assume Texas has passed a statute that provides that it will not authorize a birth certificate for any child born in the state unless both parents can prove they are citizens. If Texas argues that its reason for the statute is that Texas must be certain that the child is a citizen, a challenger would most correctly argue:`,
    opts:[
      "The Fourteenth Amendment provides that all persons are born in the United States must be naturalized.",
      "The Fourteenth Amendment provides that all persons born in the United States are citizens of the United States.",
      "The Fourteenth Amendment grants state citizenship to noncitizens.",
      "The Fourteenth Amendment applies to \"any person\" including noncitizens."
    ], ans:1 },
  { cls:"Class 12", qLabel:"Q2",
    text:`The Court in Scott v. Sandford held that Dred Scott was not a citizen of Missouri. This holding was most specifically invalidated by the:`,
    opts:[
      "Fourteenth Amendment section 1",
      "Fourteenth Amendment section 3",
      "Fourteenth Amendment section 2",
      "Thirteenth Amendment"
    ], ans:0 },
  { cls:"Class 12", qLabel:"Q3",
    text:`True or False: It was generally accepted that the framers of the Constitution\u2019s Bill of Rights intended to protect individuals against actions by the federal government but not state or local governments.`,
    opts:["True","False"], ans:0 },
  { cls:"Class 12", qLabel:"Q4",
    text:`The Slaughter-House Cases have been strongly criticized but the case has never been overruled. It rendered the Privileges or Immunities Clause essentially defunct as a means to apply provisions of the Bill of Rights to the States. Which provision of the Fourteenth Amendment is most important to the incorporation of the Bill of Rights?`,
    opts:[
      "Equal Protection Clause",
      "Due Process Clause",
      "Privileges or Immunities Clause",
      "Citizenship Clause"
    ], ans:1 },

  // ─── CLASS 13 ───
  { cls:"Class 13", qLabel:"Q1",
    text:`Which of the following best describes the significance and importance of Footnote 4 in U.S. v. Carolene Products ?`,
    opts:[
      "It outlined the path for the Supreme Court to more closely examine interference with fundamental rights and discrimination against minorities.",
      "It repudiated the Supreme Court\u2019s rigorous review of economic regulation by Congress and by the states.",
      "It created a roadmap for incorporating the provisions of the Bill of Rights to apply to the states.",
      "It established the right to vote as a fundamental right."
    ], ans:0 },

  // ─── CLASS 14 ───
  { cls:"Class 14", qLabel:"Q1",
    text:`In a series of cases, the Supreme Court has examined the constitutionality of government funding for abortion. Which statement most clearly articulates the Supreme Court\u2019s rationale regarding whether the government has a duty to fund such procedures?`,
    opts:[
      "The Due Process Clause confers no affirmative right to government aid, even where such aid maybe necessary to secure the liberty interests of which the government itself may not deprive the individual.",
      "The Spending Clause confers no affirmative right to government aid, except where such aid may be necessary to secure the liberty interests of which the government itself may not deprive the individual.",
      "The Due Process Clause confers no affirmative right to government aid, unless the right is fundamental.",
      "The Spending Clause confers an affirmative right to government aid."
    ], ans:0 },
  { cls:"Class 14", qLabel:"Q2",
    text:`In Roe v. Wade, the Supreme Court\u2019s noted that \u201cthroughout the major portion of the 19th century, prevailing legal abortion practices were far freer than they are today. . . .\u201d\n\nWhich is the best statement clarifying the doctrinal relevance of such a conclusion that historically "legal abortion practices were far freer"?`,
    opts:[
      "In order for a right to be deemed fundamental, and thus subject to strict scrutiny, it should be deeply rooted in this nation\u2019s history and tradition.",
      "In order for a right to be deemed fundamental, it must not have been criminalized at common law.",
      "In order for a right to be deemed fundamental, and thus subject to strict scrutiny, it must not have been criminalized at common law.",
      "In order for a right to be deemed fundamental, and thus subject to strict scrutiny, it should be an implicit part of 19th Century legal practice."
    ], ans:0 },

  // ─── CLASS 18 ───
  { cls:"Class 18", qLabel:"Q1",
    text:`A state statute provides that any married persons who engage in certain \u201cunnatural\u201d sex acts as described by the statute (e.g., contact between one person\u2019s mouth and the other\u2019s genitalia) are guilty of second degree sodomy, and that unmarried persons who engage in those acts are guilty of first degree sodomy. John and Mary Dalton, a married couple, were prosecuted for second degree sodomy after engaging in the prohibited acts with each other in a friend\u2019s home while at a party. In defense, they asserted that the statute was invalid under the United States Constitution.\n\nThe most effective argument in support of the assertion that the statute was unconstitutional is that it violated the Daltons\u2019 constitutional right to...`,
    opts:[
      "Procedural due process",
      "Equal protection",
      "Freedom of expression",
      "Substantive due process"
    ], ans:3 },
  { cls:"Class 18", qLabel:"Q2",
    text:`In a case in which the constitutionality of a state law regulating the sale of birth control devices is in issue, which party will have the burden of persuasion?`,
    opts:[
      "The person challenging the statute, since the regulation on non-expressive sexual conduct is reserved to the states by the Tenth Amendment.",
      "The state, because right to contraception involves a fundamental right, and the law may have a substantial impact on that right.",
      "The person challenging the statute, since there is a rebuttable presumption that all state laws are constitutional.",
      "The state, because the state law is more likely to have a substantial impact on women than on men."
    ], ans:1 },

  // ─── CLASS 19 ───
  { cls:"Class 19", qLabel:"Q1",
    text:`Choose the best statement of the Court\u2019s holding in Plessy v. Ferguson.`,
    opts:[
      "A statute mandating equal but separated by race accommodations in railroad transportation is reasonable and does not violate the Equal Protection Clause or other clauses of the Fourteenth Amendment or the Thirteenth Amendment.",
      "A statute mandating equal but separated by race accommodations in railroad transportation is a permissible expression of the customs of people.",
      "A statute mandating equal but separated by race is compelling and does not violate the Equal Protection Clause or other clauses of the Fourteenth Amendment or the Thirteenth Amendment.",
      "A statute mandating equal but separated by race accommodations is the essence of formal equality mandated by the Equal Protection Clause."
    ], ans:0 },
  { cls:"Class 19", qLabel:"Q2",
    text:`As Justice Harlan predicted in his dissenting opinion in Plessy v. Ferguson, the case proved to be "pernicious." It can be viewed as the Court\u2019s rejection of the promise of the Reconstruction Amendments and Reconstruction itself. The case is now generally reviled. It was rejected in the Court\u2019s unanimous opinion in Brown v. Board of Education, 347 U.S. 483 (1954).\n\nFrom the Plessy decision in 1896 until Brown in 1954, advocates for racial equality developed legal strategies to undermine Plessy and its holding.\n\nConsidering the holding in Plessy, which argument would advocates for racial equality after Plessy be least likely to advance:`,
    opts:[
      "Plessy required there to be substantive equality and that was not satisfied in the instance being challenged.",
      "Plessy was limited to \"railroad transportation\" and thus did not apply to other important aspects of equality.",
      "Plessy required any accommodations or other circumstances to be \"equal\" and that was not satisfied in the instance being challenged.",
      "Plessy required the standard applicable to racial classifications to be merely \"reasonable,\" but the standard should be higher."
    ], ans:0 },
  { cls:"Class 19", qLabel:"Q3",
    text:`The Court in Plessy v. Ferguson stated that the "distinction between laws interfering with the political equality of the negro and those requiring the separation of the two races in schools, theaters, and railway carriages has been frequently drawn by this Court," and the Court has protected the right to sit upon juries because this "was a discrimination which implied a legal inferiority in civil society, which lessened the security of the right of the colored race, and was a step towards reducing them to a condition of servility."\n\nIn support, the Court cited:`,
    opts:[

// ─── STATE ───
let correct=0, wrong=0;
const total=questions.length;
const selected=new Array(total).fill(-1); // track which option is selected before submit

function render(){
  const c=document.getElementById('quizContainer');
  let html='';let curClass='';
  questions.forEach((q,i)=>{
    if(q.cls!==curClass){curClass=q.cls;html+=`<div class="class-divider">${curClass}</div>`;}
    const letters='ABCD';
    html+=`<div class="q-card" id="qcard${i}">
      <div class="q-num">${q.cls} \u00b7 ${q.qLabel} \u00a0\u00b7\u00a0 #${i+1} of ${total}</div>
      <div class="q-text">${q.text.replace(/\n/g,'<br>')}</div>
      <div class="options">${q.opts.map((o,j)=>`<button class="opt-btn" id="opt${i}_${j}" onclick="selectOpt(${i},${j})"><span class="letter">${letters[j]}</span><span>${o}</span></button>`).join('')}</div>
      <div class="submit-row">
        <button class="submit-btn" id="sub${i}" disabled onclick="submitAnswer(${i})">Submit</button>
        <span class="feedback" id="fb${i}"></span>
      </div>
    </div>`;
  });
  c.innerHTML=html;
  selected.fill(-1);
  updateScore();
}

function selectOpt(qi, oi){
  const card=document.getElementById('qcard'+qi);
  if(card.classList.contains('answered-correct')||card.classList.contains('answered-wrong'))return;
  // deselect previous
  const q=questions[qi];
  q.opts.forEach((_,j)=>{
    document.getElementById('opt'+qi+'_'+j).classList.remove('selected');
  });
  document.getElementById('opt'+qi+'_'+oi).classList.add('selected');
  selected[qi]=oi;
  document.getElementById('sub'+qi).disabled=false;
}

function submitAnswer(qi){
  const q=questions[qi];
  const oi=selected[qi];
  if(oi<0)return;
  const card=document.getElementById('qcard'+qi);
  if(card.classList.contains('answered-correct')||card.classList.contains('answered-wrong'))return;

  const btns=card.querySelectorAll('.opt-btn');
  const fb=document.getElementById('fb'+qi);
  const sub=document.getElementById('sub'+qi);

  // lock all buttons
  btns.forEach(b=>{b.classList.add('locked');b.classList.remove('selected');});
  sub.disabled=true;
  sub.style.display='none';

  if(oi===q.ans){
    btns[oi].classList.add('selected-correct');
    card.classList.add('answered-correct');
    fb.className='feedback show correct-fb';
    fb.textContent='\u2713 Correct!';
    correct++;
  } else {
    btns[oi].classList.add('selected-wrong');
    btns[q.ans].classList.add('reveal-correct');
    card.classList.add('answered-wrong');
    fb.className='feedback show wrong-fb';
    fb.textContent='\u2717 Incorrect \u2014 the correct answer is highlighted.';
    wrong++;
  }
  updateScore();
}

function updateScore(){
  document.getElementById('sCorrect').textContent=correct;
  document.getElementById('sWrong').textContent=wrong;
  document.getElementById('sRemain').textContent=total-correct-wrong;
}

function resetQuiz(){
  correct=0;wrong=0;render();
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
