<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constitutional Law — MC Practice Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1117;--surface:#181b24;--surface2:#1f2330;--border:#2a2e3b;
    --text:#e2e4ea;--text-muted:#8b90a0;--accent:#6c8cff;--accent-dim:#3a4d8c;
    --correct:#34d399;--correct-bg:rgba(52,211,153,.08);
    --wrong:#f87171;--wrong-bg:rgba(248,113,113,.08);
    --gold:#fbbf24;--radius:10px;
  }
  html{font-size:16px;scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Source Serif 4',Georgia,serif;line-height:1.7;
    min-height:100vh;
  }
  /* grain overlay */
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;opacity:.03;
    background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .hero{
    text-align:center;padding:4rem 1.5rem 2.5rem;
    background:linear-gradient(175deg,#151825 0%,#0f1117 100%);
    border-bottom:1px solid var(--border);position:relative;overflow:hidden;
  }
  .hero::before{
    content:'';position:absolute;top:-40%;left:50%;transform:translateX(-50%);
    width:600px;height:600px;border-radius:50%;
    background:radial-gradient(circle,rgba(108,140,255,.1) 0%,transparent 70%);
    pointer-events:none;
  }
  .hero h1{
    font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(2rem,5vw,3.2rem);
    letter-spacing:-.02em;line-height:1.15;margin-bottom:.5rem;position:relative;
    background:linear-gradient(135deg,#e2e4ea 30%,#6c8cff 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .hero p{color:var(--text-muted);font-size:1.05rem;max-width:520px;margin:0 auto;}

  /* score strip */
  .score-strip{
    position:sticky;top:0;z-index:100;
    background:rgba(15,17,23,.85);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    display:flex;justify-content:center;gap:2rem;padding:.75rem 1rem;
    font-family:'JetBrains Mono',monospace;font-size:.85rem;
  }
  .score-strip span{display:flex;align-items:center;gap:.35rem}
  .score-strip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot-correct{background:var(--correct)}.dot-wrong{background:var(--wrong)}.dot-total{background:var(--accent)}

  .container{max-width:760px;margin:0 auto;padding:1.5rem 1.25rem 6rem}

  /* class divider */
  .class-divider{
    margin:3rem 0 1.5rem;padding:.6rem 1rem;
    font-family:'Playfair Display',serif;font-weight:700;font-size:1.25rem;
    color:var(--accent);border-left:3px solid var(--accent);
    background:linear-gradient(90deg,rgba(108,140,255,.06),transparent 60%);
    border-radius:0 var(--radius) var(--radius) 0;
  }

  /* question card */
  .q-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:1.5rem;margin-bottom:1.25rem;
    transition:border-color .3s;
  }
  .q-card.answered-correct{border-color:var(--correct)}
  .q-card.answered-wrong{border-color:var(--wrong)}
  .q-num{
    font-family:'JetBrains Mono',monospace;font-size:.75rem;
    color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;
  }
  .q-text{font-size:1.02rem;margin-bottom:1.15rem;line-height:1.75}

  .options{display:flex;flex-direction:column;gap:.5rem}
  .opt-btn{
    background:var(--surface2);border:1px solid var(--border);
    border-radius:8px;padding:.75rem 1rem;text-align:left;
    color:var(--text);font-family:'Source Serif 4',serif;font-size:.95rem;
    cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:.6rem;
    line-height:1.6;
  }
  .opt-btn:hover:not(.locked){background:#252937;border-color:#3a3f52}
  .opt-btn .letter{
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:.8rem;
    min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    border-radius:6px;background:var(--border);color:var(--text-muted);flex-shrink:0;
    margin-top:2px;transition:all .2s;
  }
  .opt-btn.selected-correct{background:var(--correct-bg);border-color:var(--correct)}
  .opt-btn.selected-correct .letter{background:var(--correct);color:#0f1117}
  .opt-btn.selected-wrong{background:var(--wrong-bg);border-color:var(--wrong)}
  .opt-btn.selected-wrong .letter{background:var(--wrong);color:#0f1117}
  .opt-btn.reveal-correct{border-color:var(--correct);opacity:.7}
  .opt-btn.reveal-correct .letter{background:var(--correct);color:#0f1117}
  .opt-btn.locked{cursor:default;opacity:.55}
  .opt-btn.locked.selected-correct,.opt-btn.locked.selected-wrong,.opt-btn.locked.reveal-correct{opacity:1}

  .feedback{
    margin-top:.75rem;padding:.6rem .9rem;border-radius:8px;font-size:.9rem;
    font-family:'JetBrains Mono',monospace;display:none;
  }
  .feedback.show{display:block}
  .feedback.correct-fb{background:var(--correct-bg);color:var(--correct)}
  .feedback.wrong-fb{background:var(--wrong-bg);color:var(--wrong)}

  /* bottom bar */
  .bottom-bar{
    position:fixed;bottom:0;left:0;right:0;
    background:rgba(15,17,23,.9);backdrop-filter:blur(12px);
    border-top:1px solid var(--border);padding:.8rem;text-align:center;
  }
  .reset-btn{
    background:var(--accent-dim);color:#fff;border:none;
    padding:.55rem 1.6rem;border-radius:8px;font-family:'JetBrains Mono',monospace;
    font-size:.85rem;cursor:pointer;transition:background .2s;
  }
  .reset-btn:hover{background:var(--accent)}

  @media(max-width:600px){
    .container{padding:1rem .75rem 5rem}
    .q-card{padding:1.1rem}
    .hero{padding:2.5rem 1rem 1.5rem}
  }
</style>
</head>
<body>
<div class="hero">
  <h1>Constitutional Law MC Quiz</h1>
  <p>Practice questions from your class assignments. Pick an answer to see instant feedback.</p>
</div>

<div class="score-strip" id="scoreStrip">
  <span><span class="dot dot-correct"></span> Correct: <strong id="sCorrect">0</strong></span>
  <span><span class="dot dot-wrong"></span> Wrong: <strong id="sWrong">0</strong></span>
  <span><span class="dot dot-total"></span> Remaining: <strong id="sRemain">0</strong></span>
</div>

<div class="container" id="quizContainer"></div>

<div class="bottom-bar">
  <button class="reset-btn" onclick="resetQuiz()">Reset All Answers</button>
</div>

<script>
const questions = [
  // Class 3
  { cls:"Class 3", num:1, text:`President Trump just signed into law the federal No Teacher Tenure Act, which provides that school districts no longer needed to recognize the tenure of elementary school teachers. The union filed an action in federal court on behalf of the teachers, asking for an injunction and a declaratory judgment stating that the law is invalid.\n\nShould the federal court hear the case?`,
    opts:[
      "Yes, because the federal law encourages improper interference with a contract.",
      "No, because the union does not have standing to sue on behalf of the teachers.",
      "No, because a ruling on the law at this point is premature.",
      "Yes, because the teachers' rights and benefits are threatened by the law and the school board's stated plans."
    ], ans:2 },

  // Class 8
  { cls:"Class 8", num:1, text:`Congress authorized $15 million for states with locust outbreaks. Under the law, all federal environmental protection funding would be contingent on state implementation of the spraying program. Nebraska refused and the federal government terminated all environmental protection funding.\n\nWho will most likely prevail?`,
    opts:[
      "The federal government, because depriving Nebraska of federal funding amounting to less than 2% of the state's budget is not unduly coercive.",
      "The federal government, because controlling locust populations in multiple states is a valid regulation of interstate commerce.",
      "Nebraska, because controlling locust populations is not a regulation of interstate commerce.",
      "Nebraska, because Congress may not use its spending power to coerce states into implementing federal programs."
    ], ans:0 },
  { cls:"Class 8", num:2, text:`Congress enacted a $30 tax on each person flying into the seven most popular vacation destinations. Officials in those destinations want to challenge the legislation.\n\nIf an official with standing challenges the tax, is it likely that the tax is found constitutional?`,
    opts:[
      "Yes, because Congress has plenary power to impose taxes to raise revenue.",
      "Yes, because the tax is necessary to achieve a compelling government interest.",
      "No, because the tax unfairly discriminates against certain vacation destinations.",
      "No, because it makes it significantly more difficult for persons to travel between the states."
    ], ans:0 },
  { cls:"Class 8", num:3, text:`Congress provided by statute that any state that does not enact a ban on texting while driving within 4 years shall be denied 20% of federal highway construction funding.\n\nWhat is the best argument in support of constitutionality?`,
    opts:[
      "The requirement is not unduly coercive and is related to making travel on highways safer.",
      "A recent public opinion survey demonstrates that 90% of the people support the ban.",
      "The states ceded their authority over highways when they accepted federal grants.",
      "The federal government can regulate use of state highways without limitation because it paid for most of their construction."
    ], ans:0 },
  { cls:"Class 8", num:4, text:`Congress enacted SOBA imposing criminal penalties for killing bobcats, as Congress determined they are important to tourism. California classified bobcats as varmint. A farmer is prosecuted under SOBA.\n\nWhat is the strongest constitutional argument in support of SOBA?`,
    opts:[
      "The commerce power.",
      "The police power.",
      "The Necessary and Proper Clause.",
      "The power to regulate federal lands."
    ], ans:0 },

  // Class 9
  { cls:"Class 9", num:1, text:`The President lost her temper, falsely criticized an aide with whom she had an affair, fired him and told him he would never work in government again. The aide sued for intentional infliction of emotional distress.\n\nIf the President moved to dismiss, what would be the most important criterion?`,
    opts:[
      "Whether the President's actions were predicated on her official acts.",
      "Whether the President's affair with a subordinate constituted a crime.",
      "Whether the President would be hampered in conducting official duties in defending the lawsuit.",
      "Whether the separation of powers doctrine is served by postponing the case."
    ], ans:0 },
  { cls:"Class 9", num:2, text:`Following terrorist attacks, the President issued an executive order cutting off diplomatic ties with a foreign country, including closing its embassy. The consul brought an action to enjoin enforcement.\n\nWill the court hear the case?`,
    opts:[
      "No, because Article II gives the President exclusive authority to recognize foreign governments.",
      "No, because lower federal courts lack original jurisdiction over cases involving ambassadors and consuls.",
      "Yes, because the consul has suffered redressable harm.",
      "Yes, because the President's action usurps Congress's power to regulate foreign commerce."
    ], ans:0 },
  { cls:"Class 9", num:3, text:`In the Steel Seizure case, which of the following was NOT part of the majority or concurring opinions regarding President Truman's authority?`,
    opts:[
      "The Executive has unfettered authority.",
      "The Executive's power is at its lowest ebb when acting against the will of Congress.",
      "The Executive's power is at its height when acting with the support of Congress.",
      "There is a 'zone of twilight' where the Court must determine whether Congress supported the Executive's action."
    ], ans:0 },

  // Class 10
  { cls:"Class 10", num:1, text:`The President drew a line through one of two appropriations in a bill, canceling it, and then signed the bill. The affected professor brought suit.\n\nWas the President's action constitutional?`,
    opts:[
      "No, because the President has no line item veto power.",
      "No, because the President may not veto an appropriation passed by Congress.",
      "Yes, because the President could have vetoed the appropriation if it were in a separate bill.",
      "Yes, because the President has the power to refuse to spend funds unless specifically mandated."
    ], ans:0 },
  { cls:"Class 10", num:2, text:`The Stop Terrorism Act authorized President A to designate state sponsors of terrorism. President B designated traditional allies. Congress passed a joint resolution reinstating trade agreements.\n\nIf President B seeks to enforce the sanctions, are they valid?`,
    opts:[
      "Yes, because the President did not sign the joint resolution.",
      "No, because presidential economic power is at its lowest ebb when conflicting with Congress.",
      "Yes, because Congress can regulate domestic but not foreign commerce.",
      "No, because Congress has exclusive power to regulate commerce with foreign nations."
    ], ans:0 },

  // Class 11
  { cls:"Class 11", num:2, text:`A candidate for mayor will have been a resident for only 4.5 years at the time he would take office (5-year requirement). He filed suit for a declaratory judgment naming only his party chairman as defendant.\n\nWhich best reflects the action the court should take?`,
    opts:[
      "Refuse to determine the merits because there is no case or controversy.",
      "Refuse to issue the declaratory judgment because it does not present a substantial federal question.",
      "Issue the declaratory judgment because the candidate will have substantially complied.",
      "No answer text provided."
    ], ans:0 },
  { cls:"Class 11", num:6, text:`The Vice President conspired to sell military weapons to a foreign country. The House voted to impeach by one vote, and the Senate voted to remove by one vote.\n\nIf the VP refuses to leave, what is her best argument?`,
    opts:[
      "The Senate did not have enough votes to convict her.",
      "Only the President may be impeached.",
      "A two-thirds vote of both Houses is required to convict.",
      "The Senate, not the House, is the appropriate body to impeach."
    ], ans:0 },

  // Class 12
  { cls:"Class 12", num:1, text:`Texas passed a statute that will not authorize a birth certificate unless both parents can prove citizenship. A challenger would most correctly argue:`,
    opts:[
      "The 14th Amendment provides that all persons born in the US must be naturalized.",
      "The 14th Amendment provides that all persons born in the US are citizens of the US.",
      "The 14th Amendment grants state citizenship to noncitizens.",
      "The 14th Amendment applies to 'any person' including noncitizens."
    ], ans:1 },
  { cls:"Class 12", num:2, text:`The Court in Scott v. Sandford held that Dred Scott was not a citizen. This holding was most specifically invalidated by the:`,
    opts:[
      "Fourteenth Amendment section 1",
      "Fourteenth Amendment section 3",
      "Fourteenth Amendment section 2",
      "Thirteenth Amendment"
    ], ans:0 },
  { cls:"Class 12", num:3, text:`True or False: The framers of the Bill of Rights intended to protect individuals against actions by the federal government but not state or local governments.`,
    opts:["True","False"], ans:0 },
  { cls:"Class 12", num:4, text:`The Slaughter-House Cases rendered the Privileges or Immunities Clause essentially defunct. Which provision of the 14th Amendment is most important to incorporation of the Bill of Rights?`,
    opts:[
      "Equal Protection Clause",
      "Due Process Clause",
      "Privileges or Immunities Clause",
      "Citizenship Clause"
    ], ans:1 },

  // Class 13
  { cls:"Class 13", num:1, text:`Which best describes the significance of Footnote 4 in U.S. v. Carolene Products?`,
    opts:[
      "It outlined the path for more closely examining interference with fundamental rights and discrimination against minorities.",
      "It repudiated the Court's rigorous review of economic regulation.",
      "It created a roadmap for incorporating the Bill of Rights to the states.",
      "It established the right to vote as a fundamental right."
    ], ans:0 },

  // Class 14
  { cls:"Class 14", num:1, text:`Which statement most clearly articulates the Supreme Court's rationale regarding government funding for abortion?`,
    opts:[
      "The Due Process Clause confers no affirmative right to government aid, even where such aid may be necessary to secure liberty interests.",
      "The Spending Clause confers no affirmative right except where necessary to secure liberty interests.",
      "The Due Process Clause confers no affirmative right unless the right is fundamental.",
      "The Spending Clause confers an affirmative right to government aid."
    ], ans:0 },
  { cls:"Class 14", num:2, text:`In Roe v. Wade, the Court noted that historically "legal abortion practices were far freer." Which best clarifies the doctrinal relevance?`,
    opts:[
      "For a right to be fundamental and subject to strict scrutiny, it should be deeply rooted in this nation's history and tradition.",
      "For a right to be fundamental, it must not have been criminalized at common law.",
      "For a right to be fundamental and subject to strict scrutiny, it must not have been criminalized at common law.",
      "For a right to be fundamental and subject to strict scrutiny, it should be an implicit part of 19th Century legal practice."
    ], ans:0 },

  // Class 18
  { cls:"Class 18", num:1, text:`A state statute provides that married persons who engage in certain "unnatural" sex acts are guilty of second degree sodomy. A married couple was prosecuted. The most effective argument that the statute is unconstitutional is that it violated their right to:`,
    opts:[
      "Procedural due process",
      "Equal protection",
      "Freedom of expression",
      "Substantive due process"
    ], ans:3 },
  { cls:"Class 18", num:2, text:`In a case about the constitutionality of a state law regulating the sale of birth control devices, which party will have the burden of persuasion?`,
    opts:[
      "The challenger, since regulation of non-expressive sexual conduct is reserved to the states.",
      "The state, because the right to contraception involves a fundamental right.",
      "The challenger, since there is a rebuttable presumption that all state laws are constitutional.",
      "The state, because the law is more likely to substantially impact women than men."
    ], ans:1 },

  // Class 19
  { cls:"Class 19", num:1, text:`Choose the best statement of the Court's holding in Plessy v. Ferguson:`,
    opts:[
      "A statute mandating equal but separated by race accommodations in railroad transportation is reasonable and does not violate the Equal Protection Clause or 14th/13th Amendments.",
      "Such a statute is a permissible expression of the customs of people.",
      "Such a statute is compelling and does not violate the Equal Protection Clause.",
      "Such a statute is the essence of formal equality mandated by the Equal Protection Clause."
    ], ans:0 },
  { cls:"Class 19", num:2, text:`Which argument would advocates for racial equality after Plessy be LEAST likely to advance?`,
    opts:[
      "Plessy required substantive equality and that was not satisfied.",
      "Plessy was limited to 'railroad transportation' and did not apply to other aspects of equality.",
      "Plessy required accommodations to be 'equal' and that was not satisfied.",
      "Plessy required the standard to be merely 'reasonable,' but the standard should be higher."
    ], ans:0 },
  { cls:"Class 19", num:3, text:`The Court in Plessy cited a case about the right to sit on juries as a protection of political equality. In support, the Court cited:`,
    opts:[
      "Strauder v. West Virginia",
      "The Slaughter-House Cases",
      "The Civil Rights Cases",
      "Yick Wo v. Hopkins"
    ], ans:0 },

  // Class 20
  { cls:"Class 20", num:1, text:`If you represent San Francisco against an Equal Protection challenge alleging discrimination against Asian-Americans, would you rather a court decide the city's action makes a classification based on ethnicity or not?`,
    opts:["Not based on ethnicity","Based on ethnicity"], ans:0 },
  { cls:"Class 20", num:2, text:`If you are challenging a state action on Equal Protection grounds, would you rather a court decide the state action makes a racial classification or does not?`,
    opts:["Makes a Racial Classification","Does not make a Racial Classification"], ans:0 },
  { cls:"Class 20", num:3, text:`Assume Hawai'i's Constitution provides that only "Native Hawaiian ancestry" persons can vote for certain agency officers. The best argument for challengers would be:`,
    opts:[
      "Distinctions based solely on ancestry are by their nature odious and thus strict scrutiny applies.",
      "Since Hawai'i was not a state when the 14th Amendment was adopted, the Equal Protection Clause does not apply.",
      "There is no proof that the framers intended to discriminate.",
      "Ancestry distinctions are odious unless the state demonstrates they are supported by a narrowly tailored governmental interest."
    ], ans:0 },

  // Class 22
  { cls:"Class 22", num:1, text:`The Young Trailblazers, a private youth organization open only to white children, rejected a twelve-year-old Black child's application solely based on race.\n\nIs the Young Trailblazers guilty of violating the state statute?`,
    opts:[
      "No, because the Young Trailblazers is a private organization.",
      "Yes, because it denied Penny's right to substantive due process.",
      "Yes, because it denied Penny's right to privileges and immunities of citizenship.",
      "Yes, because it denied Penny's right to equal protection."
    ], ans:0 },

  // Class 23
  { cls:"Class 23", num:1, text:`A state law raised the minimum driving age to 21 for males only (females could still get licenses at 16), based on accident statistics. An 18-year-old male lost his job.\n\nIf the young man sues and prevails, what is the most likely reason?`,
    opts:[
      "The state could not prove the law was substantially related to an important government interest.",
      "The state could not prove the law was the least restrictive means of achieving a compelling purpose.",
      "The state could not prove the law was rationally related to a legitimate government purpose.",
      "The state could not prove the law was necessary to achieve a compelling government purpose."
    ], ans:0 },

  // Class 24
  { cls:"Class 24", num:1, text:`D.C. passed an ordinance prohibiting young men aged 14–20 from being out after 10 PM unless accompanied by a female, to "reduce violence among male gang members." Sean, 17, was fined.\n\nShould the court find the ordinance constitutional?`,
    opts:[
      "No, unless D.C. can show the ordinance is substantially related to important government objectives.",
      "Yes, if D.C. can show a rational relationship to maintaining order.",
      "Yes, because the government is performing a parens patriae function.",
      "No, if Sean can show it was not necessary to promote a compelling interest."
    ], ans:0 },
  { cls:"Class 24", num:2, text:`D.C. requires fewer push-ups for women than men in the firefighter physical exam. D.C. counsel argued plaintiffs must demonstrate a more serious denial of equal protection because D.C. is federal.\n\nWhat is plaintiffs' strongest argument in response?`,
    opts:[
      "The equal protection analysis is only slightly higher for federal acts.",
      "The analysis is at the Court's discretion for federal acts.",
      "The analysis is lower for federal acts.",
      "The equal protection analysis is the same whether federal or state government acts are being challenged."
    ], ans:3 },

  // Class 25
  { cls:"Class 25", num:1, text:`New York's retirement system gives smaller monthly benefits to those who abstain from alcohol (longer life expectancy). Tina Teetotaler challenges the benefit standard.\n\nWhat would be the appropriate burden of proof?`,
    opts:[

    opts:[
      "Unconstitutional, as a denial of equal protection.",
      "Constitutional, as an effort to protect health and welfare.",

      "Unconstitutional, as a violation of freedom to contract."
    ], ans:0 },
  { cls:"Class 25", num:3, text:`Sylvia, a non-citizen lawful resident, was denied a public school teaching position solely because she was not a US citizen.\n\nIs Sylvia likely to be successful in her 14th Amendment action?`,

    ], ans:0 },
  { cls:"Class 25", num:4, text:`Stars Hollow charges $700 application fee and $100/month for its country club/pool, while parks are free. Lorelai cannot afford the fees.\n\nIf she sues claiming the fees discriminate against the poor under the Equal Protection Clause, will she prevail?`,

  { cls:"Final Review", num:3, text:`Congress wishes to prohibit discrimination in the sale or rental of housing based on sexual orientation, applying to all public and private vendors.\n\nWhat provides the strongest basis?`,
    opts:[

      "The Commerce Clause, because the sale or rental of housing in aggregate could have a substantial effect on interstate commerce.",

      "The Fourteenth Amendment enabling clause."
    ], ans:1 },
  { cls:"Final Review", num:4, text:`A special prosecutor subpoenaed memoranda from a presidential aide. The President moved to quash on executive privilege grounds.\n\nHow should the trial judge rule?`,
    opts:[
      "Deny, because the President has no greater privilege than any other officer.",
      "Deny, because although there is a presumption of privilege, it can be overcome by a strong showing of the needs of the criminal justice system.",
      "Grant, because executive privilege is an absolute bar except in impeachment.",
      "Grant, because the President is entitled to confidential advice from subordinates."
    ], ans:1 },
  { cls:"Final Review", num:5, text:`A state made it a crime to be the biological parent of more than two children. A couple was convicted after having a third child.\n\nWhat is the strongest argument for voiding the convictions?`,
    opts:[
      "No rational basis for concluding the statute would further the government's stated interests.",
      "The statute burdens the fundamental privacy interests of married persons.",
      "The statute places too much discretion in state officials.",
      "The statute denies married persons equal protection."
    ], ans:1 },
  { cls:"Final Review", num:6, text:`A state denied in-state tuition to resident aliens who were citizens of countries that held US citizens as hostages. The plaintiff had qualified for in-state tuition before the statute.\n\nWhat is his best argument?`,
    opts:[
      "Higher education is a fundamental right under the Privileges or Immunities Clause.",
      "The statute violates the prohibition of ex post facto laws.",
      "Alienage is a suspect category under Equal Protection, and the state has not met the appropriate standard.",
      "Attending a state university is a property right that may not be taken without due process."
    ], ans:2 },
  { cls:"Final Review", num:7, text:`A state terminated supplemental school funding derived from lottery revenues. The districts that lost funding served a predominantly Hispanic population.\n\nWhat standard should the court use?`,
    opts:[
      "The state must demonstrate the statute is necessary to vindicate a compelling interest (suspect class).",
      "Parents must demonstrate the statute is not substantially related to an important interest (no fundamental right).",
      "Parents must demonstrate the statute is not rationally related to any legitimate state interest (no suspect class or fundamental right).",
      "The state must demonstrate the statute is rationally related to a legitimate interest (not discriminatory in intent)."
    ], ans:2 },
];

let correct=0, wrong=0;
const total=questions.length;

function render(){
  const c=document.getElementById('quizContainer');
  let html='';let curClass='';
  questions.forEach((q,i)=>{
    if(q.cls!==curClass){curClass=q.cls;html+=`<div class="class-divider">${curClass}</div>`;}
    const letters='ABCD';
    html+=`<div class="q-card" id="qcard${i}">
      <div class="q-num">Question ${i+1} of ${total}</div>
      <div class="q-text">${q.text.replace(/\n/g,'<br>')}</div>
      <div class="options">${q.opts.map((o,j)=>`<button class="opt-btn" data-q="${i}" data-o="${j}" onclick="pick(${i},${j})"><span class="letter">${letters[j]}</span><span>${o}</span></button>`).join('')}</div>
      <div class="feedback" id="fb${i}"></div>
    </div>`;
  });
  c.innerHTML=html;
  updateScore();
}

function pick(qi,oi){
  const q=questions[qi];
  const card=document.getElementById('qcard'+qi);
  if(card.classList.contains('answered-correct')||card.classList.contains('answered-wrong'))return;
  const btns=card.querySelectorAll('.opt-btn');
  const fb=document.getElementById('fb'+qi);
  btns.forEach(b=>b.classList.add('locked'));
  if(oi===q.ans){
    btns[oi].classList.add('selected-correct');
    card.classList.add('answered-correct');
    fb.className='feedback show correct-fb';
    fb.textContent='✓ Correct!';
    correct++;
  } else {
    btns[oi].classList.add('selected-wrong');
    btns[q.ans].classList.add('reveal-correct');
    card.classList.add('answered-wrong');
    fb.className='feedback show wrong-fb';
    fb.textContent='✗ Incorrect — the correct answer is highlighted above.';
    wrong++;
  }
  updateScore();
}

function updateScore(){
  document.getElementById('sCorrect').textContent=correct;
  document.getElementById('sWrong').textContent=wrong;
  document.getElementById('sRemain').textContent=total-correct-wrong;
}

function resetQuiz(){
  correct=0;wrong=0;render();
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
