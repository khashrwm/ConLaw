<div class="hero">
  <h1>Constitutional Law MC Quiz</h1>

<script>
const Q=[
// ─── CLASS 3 ───
{c:"Class 3",q:"Q1",t:`President Trump just signed into law the federal No Teacher Tenure Act, which provides that school districts no longer needed to recognize the tenure of elementary school teachers\u2014all tenured teachers would lose their status and would be treated the same as non-tenured teachers. Under the NTTA, all tenured teachers may be fired for inadequate performance much more easily than before. In addition, it allows tenured teachers\u2019 salaries to be lowered, at least until a new contract with the teachers can be negotiated. The law has a 2 year grace period before it takes effect, to give schools and teachers time to adjust to the law; however, it specifically provided that once it is in effect, school board actions under the law supersede any existing contract terms.\n\nPlainfield Public School District is in the first year of a 3 year union contract with its teachers. The school board has stated that it plans to abolish tenured positions as soon as the law takes effect. The union believes that, once the NTTA takes effect, it will invalidate numerous terms of the union contract. Thus, the union filed an action in federal court on behalf of the teachers, asking for an injunction to prevent the school board from abolishing tenured positions and for a declaratory judgment stating that the law is invalid.\n\nShould the federal court hear the case?`,
o:["Yes, because the federal law encourages improper interference with a contract.","No, because the union does not have standing to sue on behalf of the teachers.","No, because a ruling on the law at this point is premature.","Yes, because the teachers\u2019 rights and benefits are threatened by the law and the school board\u2019s stated plans."],a:2,
e:"The case is not ripe. The NTTA has a 2-year grace period and has not yet taken effect, so no concrete injury has occurred. Courts generally will not rule on the constitutionality of a law before it is enforced. The school board's stated plans alone are not enough — the dispute is premature until the law actually takes effect and action is taken under it."},

// ─── CLASS 8 ───
{c:"Class 8",q:"Q1",t:`Congress authorized $15 million to go to Nebraska and neighboring states that had reported outbreaks of a serious virus spread via a locust infestation. The states were required to use the money for spraying to eradicate locust larva. Under the law, all federal environmental protection funding to the states would be contingent on state implementation of the spraying program. In Nebraska, federal environmental protection funding constituted about 1.2 % of the state\u2019s budget. Nebraska determined that the chemical spray could have negative environmental consequences and refused to implement the program. Consequently, the federal government terminated all of the Nebraska\u2019s environmental protection funding. Nebraska filed an action to force the federal government to continue to provide funding for its other environmental protection projects unrelated to the locust-spraying program.\n\nWho will most likely prevail?`,
o:["The federal government, because depriving Nebraska of federal funding amounting to less than 2% of the state\u2019s budget is not unduly coercive.","The federal government, because controlling locust populations in multiple states is a valid regulation of interstate commerce.","Nebraska, because controlling locust populations is not a regulation of interstate commerce.","Nebraska, because Congress may not use its spending power to coerce states into implementing federal programs."],a:0,
e:"Under South Dakota v. Dole and NFIB v. Sebelius, Congress may attach conditions to federal funding as long as they are not unduly coercive. Here, the environmental funding is only about 1.2% of Nebraska's budget — far below the threshold found coercive in NFIB (where Medicaid was over 10% of state budgets). This amount of financial pressure is permissible encouragement, not unconstitutional coercion."},

{c:"Class 8",q:"Q2",t:`Due to budget shortages and a critical need of funding to offset the costs of the global health crisis, Congress enacted a $30 tax on each person flying into an airport in the seven most popular vacation destinations in the country, as determined by Congress. Fearing that the number of vacationers to the taxed destinations would decrease due to the tax, officials in the seven destinations wanted to challenge the legislation after Congress implemented the tax.\n\nIf an official with standing challenges the tax, is it likely that the tax is found constitutional?`,
o:["Yes, because Congress has plenary power to impose taxes to raise revenue.","Yes, because the tax is necessary to achieve a compelling government interest.","No, because the tax unfairly discriminates against certain vacation destinations by taxing them and not taxing other, similar vacation destinations.","No, because it makes it significantly more difficult for persons to travel between the states."],a:0,
e:"Congress has broad taxing power under Article I, \u00a78. A tax does not need to be perfectly uniform across all locations — Congress has plenary power to impose taxes to raise revenue. The tax here is a straightforward revenue measure. Compelling interest analysis (B) applies to fundamental rights, not taxing power. The tax doesn't burden the right to travel (D) in any constitutionally significant way."},

{c:"Class 8",q:"Q3",t:`Congress provided by statute that any state that does not enact a ban on texting while driving on state highways within the next 4 years shall be denied 20% of federal highway construction funding.\n\nWhat is the best argument that can be made in support of the constitutionality of this federal statute?`,
o:["The requirement is not unduly coercive and is related to making travel on highways safer.","A recent public opinion survey demonstrates that 90% of the people in this country support the ban.","The states ceded their authority over highways to the national government when the states accepted federal grants to help finance the highways.","The federal government can regulate the use of state highways without limitation because the federal government paid for most of their construction costs."],a:0,
e:"Under South Dakota v. Dole, Congress may condition federal funds if: (1) spending serves the general welfare, (2) conditions are unambiguous, (3) conditions relate to the federal interest in the program, and (4) conditions are not unduly coercive. Denying 20% of highway funding for failure to ban texting while driving is directly related to highway safety and is not so large as to be coercive. Public opinion (B) is irrelevant to constitutional analysis. States did not 'cede authority' (C), and the federal government cannot regulate without limitation (D)."},

{c:"Class 8",q:"Q4",t:`Congress enacted Save Our Bobcats Act (\u201cSOBA\u201d) that imposed criminal penalties for killing bobcats, as Congress determined they are important to the tourism industry in certain regions of the country. However, California classified bobcats as varmint that may be destroyed by anyone with a general hunting license. A California farmer who possessed a valid state general hunting license regularly shot and killed bobcats that ate her chickens.\n\nIf the farmer is prosecuted under SOBA and challenges its constitutionality, which of the following is the strongest constitutional argument in support of SOBA?`,
o:["The commerce power","The police power.","The Necessary and Proper Clause.","The power to regulate federal lands."],a:0,
e:"Congress determined that bobcats are important to the tourism industry — an economic activity that substantially affects interstate commerce. Under the Commerce Clause, Congress can regulate activities with a substantial effect on interstate commerce. The police power (B) belongs to the states, not Congress. The Necessary and Proper Clause (C) is supplementary, not a standalone basis. The federal lands power (D) is too narrow since bobcats aren't limited to federal lands."},

// ─── CLASS 9 ───
{c:"Class 9",q:"Q1",t:`At a meeting with some of her advisors, the President lost her temper. She vehemently and falsely criticized a position paper prepared by an aide with whom she had had an affair just before she was elected President. She fired the aide and told him he would never work in government again \u201cexcept maybe in the mailroom.\u201d The outrageous remarks caused the aide severe emotional distress. He sued for intentional infliction of emotional distress.\n\nIf the President moved to dismiss, what would be the most important criterion that the court would use to decide the motion?`,
o:["Whether the President\u2019s actions were predicated on her official acts.","Whether the President\u2019s affair with a subordinate constituted a crime.","Whether the President would be hampered in the conduct of her official duties in defending the lawsuit.","Whether the separation of powers doctrine is served by postponing the case until the President left office."],a:0,
e:"Under Clinton v. Jones and the Court's presidential immunity doctrine, the key threshold question is whether the President's conduct was an official act or a private/unofficial act. If the conduct was part of official duties, the President may enjoy immunity. If it was private conduct, no immunity applies. The court must first classify the nature of the act before deciding on dismissal."},

{c:"Class 9",q:"Q2",t:`Following a series of terrorist attacks in a foreign country in which several Americans were held hostage, the President issued an executive order to cut off all diplomatic ties, including prohibiting most trade agreements. The executive order required the closure of the country\u2019s embassy and the removal of its consul from the United States. The country\u2019s Prime Minister, which imports billions of dollars of goods from the United States each year, threatened to stop all U.S. imports immediately unless the embassy was reopened and the consul reinstated. The consul brought an action against the United States in federal district court to enjoin enforcement of the President\u2019s action.\n\nWill the court hear the case?`,
o:["No, because Article II gives the President exclusive authority to recognize foreign governments.","No, because lower federal courts lack original jurisdiction over cases involving ambassadors and consuls.","Yes, because the consul has suffered redressable harm.","Yes, because the President\u2019s action usurps the power of Congress to regulate issues directly or indirectly affecting foreign commerce."],a:0,
e:"The President has exclusive authority under Article II to receive ambassadors and, by extension, to recognize (or de-recognize) foreign governments and manage diplomatic relations. Closing an embassy and removing a consul falls squarely within this exclusive executive power over foreign affairs. The court would not hear this challenge because it involves a non-justiciable political question within the President's core constitutional authority."},

{c:"Class 9",q:"Q3",t:`In the famous Steel Seizure case, which of the following was not part of the majority or concurring opinions regarding President Truman\u2019s authority?`,
o:["The Executive has unfettered authority.","The Executive\u2019s power is at its lowest ebb when acting against the will of Congress.","The Executive\u2019s power is at its height when acting with the support of Congress.","There is a \u201czone of twilight\u201d where the Court must view events to determine whether Congress supported the Executive\u2019s action."],a:0,
e:"In Youngstown Sheet & Tube Co. v. Sawyer, the entire point of the majority and concurrences was to reject the idea of unfettered executive authority. Justice Jackson's famous concurrence laid out three categories of presidential power — all of which place limits on the Executive. The notion of 'unfettered authority' is precisely what the Court struck down."},

// ─── CLASS 10 ───
{c:"Class 10",q:"Q1",t:`Congress approved an act that contained an appropriation of $2 million for Wyoming State University Professor Pat Pruitt to study the effects of oil drilling on the elk population in the Pacific Northwest. The bill contained a second appropriation of $1 million for a Hawaii State University Professor Jo Jackson to study the effects of volcanoes on sea levels. The President drew a line through the first appropriation, with the intent of canceling the provision, and then signed the bill. The professor studying oil drilling brought suit alleging that the action of the President was unconstitutional and therefore the striking of the appropriation invalid.\n\nWas the President\u2019s action constitutional?`,
o:["No, because the President has no line item veto power.","No, because the President may not veto an appropriation passed by Congress.","Yes, because the President could have vetoed the appropriation if it were contained in a separate bill.","Yes, because the President has the power to refuse to spend funds that have been appropriated unless the spending is specifically mandated."],a:0,
e:"In Clinton v. City of New York (1998), the Supreme Court struck down the Line Item Veto Act as unconstitutional. The Presentment Clause (Article I, \u00a77) requires the President to either sign or veto a bill in its entirety. The President cannot selectively cancel individual provisions after signing — that would effectively allow the President to amend legislation unilaterally, violating the separation of powers."},

{c:"Class 10",q:"Q2",t:`The federal Stop Terrorism Act authorized President A to designate countries as state sponsors of terrorism and impose economic sanctions on them. When President B took office, he declared numerous traditional U.S. allies state sponsors of terrorism and imposed sanctions on them. In response, Congress passed a joint resolution, identifying many of the allies as non-sponsors of terrorism and reinstating previously existing trade agreements with those countries.\n\nIf President B seeks to enforce the sanctions, are they valid?`,
o:["Yes, because the President did not sign the joint resolution.","No, because presidential economic power is at its lowest ebb when its use conflicts with the will of Congress.","Yes, because Congress has the power to regulate domestic commerce, but not foreign commerce.","No, because Congress has exclusive power to regulate commerce with foreign nations."],a:0,
e:"Under Youngstown (Jackson, J., concurring), when the President acts contrary to the expressed will of Congress, presidential power is at its 'lowest ebb.' However, the answer here is A — the President did not sign the joint resolution. For a joint resolution to have the force of law, it must be presented to the President and either signed or passed over a veto (INS v. Chadha). If the President did not sign it and Congress did not override, the resolution lacks legal force, and the original sanctions remain valid."},

// ─── CLASS 11 ───
{c:"Class 11",q:"Q2",t:`A city ordinance requires its mayor to have been a resident of the city for at least five years at the time of taking office. A candidate who is thinking about running for mayor in an election that will take place next year will have been a resident for only four and one-half years at the time he would take office. Before he decides whether to run, the candidate wants to know whether he could lawfully assume the position if elected. The candidate filed suit in the local federal district court for a declaratory judgment that the five-year residence requirement is unconstitutional. He named the chairman of his political party as the sole defendant but did not join any election official. The chairman responded by joining the candidate in requesting that the court declare the residence requirement invalid.\n\nWhich of the following best reflects the action the court should take?`,
o:["Refuse to determine the merits of this suit, because there is no case or controversy.","Refuse to issue the declaratory judgment, because an issue of this kind involving only a local election does not present a substantial federal constitutional question.","Issue the declaratory judgment, because the candidate will have substantially complied with the residency requirement.","No answer text provided."],a:0,
e:"Article III requires a genuine 'case or controversy' with adverse parties. Here, both parties — the candidate and the party chairman — want the same outcome. There is no adversity. Additionally, no election official who would enforce the requirement was named as a defendant. This is a collusive or friendly suit seeking what amounts to an advisory opinion, which federal courts cannot issue."},

{c:"Class 11",q:"Q6",t:`The Vice President conspired with various Pentagon and CIA officials to sell military weapons to a foreign country. When the President learned of these activities, he launched a full-scale investigation into the matter. The President presented his findings to Congress. The House of Representatives, by a one-vote majority, voted to impeach the Vice President. The Senate, by a one-vote majority, voted to remove the Vice President from office.\n\nIf the Vice President refuses to leave office, what is her best argument for retaining her position?`,
o:["The Senate did not have enough votes to convict her.","Only the President, not the Vice President, may be impeached.","A two-thirds vote of both Houses of Congress is required to convict.","The Senate, not the House of Representatives, is the appropriate body to impeach an executive officer."],a:0,
e:"Article I, \u00a73, Clause 6 requires a two-thirds vote of the Senate to convict on impeachment charges. A simple one-vote majority is insufficient. The VP's strongest argument is that the Senate vote fell short of the required supermajority. Note: the Vice President can be impeached (B is wrong), only the Senate convicts — not both houses (C is wrong), and the House is the correct body to impeach (D is wrong)."},

// ─── CLASS 12 ───
{c:"Class 12",q:"Q1",t:`Assume Texas has passed a statute that provides that it will not authorize a birth certificate for any child born in the state unless both parents can prove they are citizens. If Texas argues that its reason for the statute is that Texas must be certain that the child is a citizen, a challenger would most correctly argue:`,
o:["The Fourteenth Amendment provides that all persons are born in the United States must be naturalized.","The Fourteenth Amendment provides that all persons born in the United States are citizens of the United States.","The Fourteenth Amendment grants state citizenship to noncitizens.","The Fourteenth Amendment applies to \"any person\" including noncitizens."],a:1,
e:"The Fourteenth Amendment, \u00a71 plainly states: 'All persons born ... in the United States, and subject to the jurisdiction thereof, are citizens of the United States.' Citizenship is conferred by birth on U.S. soil (jus soli), regardless of parental citizenship. Texas cannot condition birth certificates on parental citizenship because the child is already a citizen by constitutional right."},

{c:"Class 12",q:"Q2",t:`The Court in Scott v. Sandford held that Dred Scott was not a citizen of Missouri. This holding was most specifically invalidated by the:`,
o:["Fourteenth Amendment section 1","Fourteenth Amendment section 3","Fourteenth Amendment section 2","Thirteenth Amendment"],a:0,
e:"Section 1 of the Fourteenth Amendment directly overruled Dred Scott by establishing that all persons born or naturalized in the United States are citizens. This granted citizenship to formerly enslaved people and their descendants, directly repudiating the Court's holding that Black people could not be citizens. The Thirteenth Amendment abolished slavery but did not specifically address citizenship."},

{c:"Class 12",q:"Q3",t:`True or False: It was generally accepted that the framers of the Constitution\u2019s Bill of Rights intended to protect individuals against actions by the federal government but not state or local governments.`,
o:["True","False"],a:0,
e:"True. The Bill of Rights was originally understood to restrain only the federal government. In Barron v. Baltimore (1833), the Supreme Court held that the Bill of Rights did not apply to state governments. It was only through the Fourteenth Amendment (ratified 1868) and the doctrine of selective incorporation that individual protections were gradually applied to the states."},

{c:"Class 12",q:"Q4",t:`The Slaughter-House Cases have been strongly criticized but the case has never been overruled. It rendered the Privileges or Immunities Clause essentially defunct as a means to apply provisions of the Bill of Rights to the States. Which provision of the Fourteenth Amendment is most important to the incorporation of the Bill of Rights?`,
o:["Equal Protection Clause","Due Process Clause","Privileges or Immunities Clause","Citizenship Clause"],a:1,
e:"Because the Slaughter-House Cases (1873) effectively gutted the Privileges or Immunities Clause, the Supreme Court turned to the Due Process Clause of the Fourteenth Amendment as the vehicle for incorporating the Bill of Rights against the states. Through 'selective incorporation,' the Court has applied most Bill of Rights protections to state governments via the Due Process Clause."},

// ─── CLASS 13 ───
{c:"Class 13",q:"Q1",t:`Which of the following best describes the significance and importance of Footnote 4 in U.S. v. Carolene Products ?`,
o:["It outlined the path for the Supreme Court to more closely examine interference with fundamental rights and discrimination against minorities.","It repudiated the Supreme Court\u2019s rigorous review of economic regulation by Congress and by the states.","It created a roadmap for incorporating the provisions of the Bill of Rights to apply to the states.","It established the right to vote as a fundamental right."],a:0,
e:"Footnote 4 in Carolene Products (1938) is one of the most famous footnotes in constitutional law. It suggested that while economic legislation would receive deferential rational basis review, legislation that (1) appears to violate specific constitutional prohibitions, (2) restricts the political process, or (3) targets 'discrete and insular minorities' might warrant 'more exacting judicial scrutiny.' This laid the groundwork for strict scrutiny and heightened protection of fundamental rights and minority groups."},

// ─── CLASS 14 ───
{c:"Class 14",q:"Q1",t:`In a series of cases, the Supreme Court has examined the constitutionality of government funding for abortion. Which statement most clearly articulates the Supreme Court\u2019s rationale regarding whether the government has a duty to fund such procedures?`,
o:["The Due Process Clause confers no affirmative right to government aid, even where such aid maybe necessary to secure the liberty interests of which the government itself may not deprive the individual.","The Spending Clause confers no affirmative right to government aid, except where such aid may be necessary to secure the liberty interests of which the government itself may not deprive the individual.","The Due Process Clause confers no affirmative right to government aid, unless the right is fundamental.","The Spending Clause confers an affirmative right to government aid."],a:0,
e:"In Maher v. Roe and Harris v. McRae, the Supreme Court held that the Due Process Clause protects against government interference with liberty but does not create affirmative obligations for the government to fund the exercise of those liberties. The government may choose not to fund abortions even though it cannot ban them — the Constitution is a charter of negative liberties, not positive entitlements."},

{c:"Class 14",q:"Q2",t:`In Roe v. Wade, the Supreme Court\u2019s noted that \u201cthroughout the major portion of the 19th century, prevailing legal abortion practices were far freer than they are today. . . .\u201d\n\nWhich is the best statement clarifying the doctrinal relevance of such a conclusion that historically "legal abortion practices were far freer"?`,
o:["In order for a right to be deemed fundamental, and thus subject to strict scrutiny, it should be deeply rooted in this nation\u2019s history and tradition.","In order for a right to be deemed fundamental, it must not have been criminalized at common law.","In order for a right to be deemed fundamental, and thus subject to strict scrutiny, it must not have been criminalized at common law.","In order for a right to be deemed fundamental, and thus subject to strict scrutiny, it should be an implicit part of 19th Century legal practice."],a:0,
e:"The Court's historical analysis served the doctrinal purpose of showing that abortion restrictions were not 'deeply rooted in this Nation's history and tradition.' Under the substantive due process framework (later articulated in Washington v. Glucksberg), a right must be deeply rooted in history and tradition to qualify as fundamental. By showing that abortion was historically more freely practiced, the Court bolstered its conclusion that the right was fundamental."},

// ─── CLASS 18 ───
{c:"Class 18",q:"Q1",t:`A state statute provides that any married persons who engage in certain \u201cunnatural\u201d sex acts as described by the statute (e.g., contact between one person\u2019s mouth and the other\u2019s genitalia) are guilty of second degree sodomy, and that unmarried persons who engage in those acts are guilty of first degree sodomy. John and Mary Dalton, a married couple, were prosecuted for second degree sodomy after engaging in the prohibited acts with each other in a friend\u2019s home while at a party. In defense, they asserted that the statute was invalid under the United States Constitution.\n\nThe most effective argument in support of the assertion that the statute was unconstitutional is that it violated the Daltons\u2019 constitutional right to...`,
o:["Procedural due process","Equal protection","Freedom of expression","Substantive due process"],a:3,
e:"The most effective argument is substantive due process. Under Lawrence v. Texas, the Court recognized that intimate consensual sexual conduct between adults is protected by the liberty interest in the Due Process Clause. The government cannot criminalize private, consensual sexual activity between adults — this is a substantive due process violation because the law intrudes on a fundamental liberty interest without adequate justification."},

{c:"Class 18",q:"Q2",t:`In a case in which the constitutionality of a state law regulating the sale of birth control devices is in issue, which party will have the burden of persuasion?`,
o:["The person challenging the statute, since the regulation on non-expressive sexual conduct is reserved to the states by the Tenth Amendment.","The state, because right to contraception involves a fundamental right, and the law may have a substantial impact on that right.","The person challenging the statute, since there is a rebuttable presumption that all state laws are constitutional.","The state, because the state law is more likely to have a substantial impact on women than on men."],a:1,
e:"In Griswold v. Connecticut, the Supreme Court recognized the right to contraception as part of the fundamental right to privacy. When a law burdens a fundamental right, strict scrutiny applies and the burden shifts to the government to show the law is narrowly tailored to serve a compelling state interest. Therefore, the state bears the burden of persuasion, not the challenger."},

// ─── CLASS 19 ───
{c:"Class 19",q:"Q1",t:`Choose the best statement of the Court\u2019s holding in Plessy v. Ferguson.`,
o:["A statute mandating equal but separated by race accommodations in railroad transportation is reasonable and does not violate the Equal Protection Clause or other clauses of the Fourteenth Amendment or the Thirteenth Amendment.","A statute mandating equal but separated by race accommodations in railroad transportation is a permissible expression of the customs of people.","A statute mandating equal but separated by race is compelling and does not violate the Equal Protection Clause or other clauses of the Fourteenth Amendment or the Thirteenth Amendment.","A statute mandating equal but separated by race accommodations is the essence of formal equality mandated by the Equal Protection Clause."],a:0,
e:"Plessy held that a Louisiana law requiring 'separate but equal' railroad accommodations was a reasonable exercise of the state's police power and did not violate either the Thirteenth or Fourteenth Amendments. The Court applied a reasonableness standard and concluded that legally mandated separation did not stamp Black people with a badge of inferiority. This holding stood until Brown v. Board of Education (1954)."},

{c:"Class 19",q:"Q2",t:`As Justice Harlan predicted in his dissenting opinion in Plessy v. Ferguson, the case proved to be "pernicious." It can be viewed as the Court\u2019s rejection of the promise of the Reconstruction Amendments and Reconstruction itself. The case is now generally reviled. It was rejected in the Court\u2019s unanimous opinion in Brown v. Board of Education, 347 U.S. 483 (1954).\n\nFrom the Plessy decision in 1896 until Brown in 1954, advocates for racial equality developed legal strategies to undermine Plessy and its holding.\n\nConsidering the holding in Plessy, which argument would advocates for racial equality after Plessy be least likely to advance:`,
o:["Plessy required there to be substantive equality and that was not satisfied in the instance being challenged.","Plessy was limited to \"railroad transportation\" and thus did not apply to other important aspects of equality.","Plessy required any accommodations or other circumstances to be \"equal\" and that was not satisfied in the instance being challenged.","Plessy required the standard applicable to racial classifications to be merely \"reasonable,\" but the standard should be higher."],a:0,
e:"Plessy did NOT require 'substantive equality' — it only required formal, surface-level equality ('separate but equal'). Advocates would be least likely to argue that Plessy demanded substantive equality because the decision explicitly allowed separation as long as facilities were nominally equal. The more effective strategies were to argue that facilities were not actually equal (C), that Plessy was limited to railroads (B), or that the reasonableness standard was too low (D)."},

{c:"Class 19",q:"Q3",t:`The Court in Plessy v. Ferguson stated that the "distinction between laws interfering with the political equality of the negro and those requiring the separation of the two races in schools, theaters, and railway carriages has been frequently drawn by this Court," and the Court has protected the right to sit upon juries because this "was a discrimination which implied a legal inferiority in civil society, which lessened the security of the right of the colored race, and was a step towards reducing them to a condition of servility."\n\nIn support, the Court cited:`,
o:["Strauder v. West Virginia, 100 U.S. 303 (1880)","The Slaughter-House Cases, 83 U.S. (16 Wall.) 36 (1873)","The Civil Rights Cases, 109 U.S. 3 (1883)","Yick Wo v. Hopkins, 118 U.S. 356 (1886)"],a:0,
e:"Strauder v. West Virginia (1880) struck down a state law that excluded Black citizens from jury service, holding it violated the Equal Protection Clause. The Plessy Court cited Strauder to distinguish between political rights (like jury service) which the Court would protect, and social separation (like railroad seating) which the Court considered a different matter."},

// ─── CLASS 20 ───
{c:"Class 20",q:"Q1",t:`If you represent the city of San Francisco against an Equal Protection Challenge alleging discrimination against Asian-Americans, would you rather a court decide that the city\u2019s action makes a classification based on ethnicity or not based on ethnicity?`,
o:["Not based on ethnicity","Based on ethnicity"],a:0,
e:"As a defender of the city, you want the lowest level of scrutiny possible. If the court finds the action makes an ethnic/racial classification, strict scrutiny applies and the city must show the action is narrowly tailored to a compelling interest — a very difficult standard. If no ethnic classification is found, rational basis review applies, which is much easier to satisfy. You'd want the court to find no ethnic classification."},

{c:"Class 20",q:"Q2",t:`If you are challenging a state action on the basis it is violating the Equal Protection Clause, would you rather a court decide that the state action makes a racial classification or does not make a racial classification?`,
o:["Makes a Racial Classification","Does not make a Racial Classification"],a:0,
e:"As a challenger, you want the highest level of scrutiny. If the court finds a racial classification, strict scrutiny applies, and the state bears the heavy burden of proving the classification is narrowly tailored to serve a compelling interest. Most laws fail strict scrutiny. If no racial classification is found, only rational basis applies, making it much harder for the challenger to win."},

{c:"Class 20",q:"Q3",t:`Assume that the Hawai\u2019i Constitution provides that only persons of "Native Hawaiian ancestry" can vote for the officers of the agency of Native Hawaiian Affairs. If persons of non-Native Hawaiian ancestry challenge the provision of the Hawai\u2018i Constitution as a violation of the Equal Protection Clause, their best argument would be:`,
o:["Distinctions between citizens solely because of their ancestry are by their very nature odious to a free people and thus strict scrutiny applies.","Since Hawai\u2019i was not a state when the Fourteenth Amendment was adopted, the Equal Protection Clause does not apply.","There is no proof that the framers of the Hawaii Constitution intended to discriminate against persons of non-Native Hawaiian ancestry.","Distinctions between citizens solely because of their ancestry are by their very nature odious to a free people unless the state can demonstrate the distinctions are supported by a narrowly tailored governmental interest."],a:0,
e:"In Rice v. Cayetano (2000), the Supreme Court struck down a similar Hawai'i voting restriction, holding that ancestry-based distinctions are a proxy for race and therefore trigger strict scrutiny under the Fifteenth Amendment and Equal Protection Clause. The best argument invokes the principle that ancestry-based distinctions are 'odious' and demand strict scrutiny — period. Option D weakens the argument by suggesting the classification could survive if narrowly tailored."},

// ─── CLASS 22 ───
{c:"Class 22",q:"Q1",t:`The Young Trailblazers is a youth organization with chapters and members in fifty states. Concentrating on what it calls \u201cthe outdoor experience,\u201d the organization attempts to teach its members to love all forms of life. According to the bylaws of the Young Trailblazers, membership is open to all white children between the ages of eight and fourteen years. Penny, a twelve-year-old black child, applied for membership in the Young Trailblazers at the joint request of the Pintada state attorney general and the United States Department of Justice. The Young Trailblazers rejected her application solely on the basis of her race, advising her in writing that membership was open only to white children.\n\nIs the Young Trailblazers guilty of violating the Pintada state statute?`,
o:["No, because the Young Trailblazers is a private organization","Yes, because the policy of the Young Trailblazers resulted in a denial of Penny\u2019s right to substantive due process","Yes, because the policy of the young Trailblazers resulted in a denial of Penny\u2019s right to the privileges and immunities of citizenship","Yes, because the policy of the Young Trailblazers resulted in a denial of Penny\u2019s right to equal protection"],a:0,
e:"The Equal Protection Clause of the Fourteenth Amendment applies only to state action, not to private organizations. The Young Trailblazers is a private organization, and its discriminatory membership policy, while morally wrong, does not constitute state action. Without state action, the constitutional protections of due process, equal protection, and privileges and immunities do not apply directly. (Congress could reach private discrimination through the Commerce Clause or the Thirteenth Amendment, but that's not the question here.)"},

// ─── CLASS 23 ───
{c:"Class 23",q:"Q1",t:`A state law required all automobile drivers to carry liability insurance; however, because of the high number of auto accidents in the state, the cost of insurance became prohibitive. A study sponsored by the state legislature showed that males under the age of 21 were four times more likely to get into automobile accidents than any other group, including females in the same age group. The study predicted that prohibiting males under the age of 21 from driving would result in a 15% reduction in all other persons\u2019 automobile insurance rates. Ultimately, the legislature raised the minimum age for obtaining a driver\u2019s license to age 21 for males. Females were still allowed to obtain licenses at age 16. An 18-year-old male living in the state when the limit was raised, and who worked as a pizza delivery driver, was fired from his job and replaced by a 17-year-old female.\n\nIf the young man sues to have the law set aside and prevails, what is the most likely reason?`,
o:["The state could not prove that the law was substantially related to an important government interest.","The state could not prove that the law was the least restrictive means of achieving a compelling government purpose.","The state could not prove that the law was rationally related to a legitimate government purpose.","The state could not prove that the law was necessary to achieve a compelling government purpose."],a:0,
e:"Gender-based classifications receive intermediate scrutiny under Craig v. Boren. The state must show the classification is 'substantially related to an important government interest.' While reducing accidents is important, a blanket ban on all males under 21 driving is likely not substantially related — it is both overinclusive (banning safe male drivers) and underinclusive (allowing female drivers who also cause accidents). The law would fail intermediate scrutiny."},

// ─── CLASS 24 ───
{c:"Class 24",q:"Q1",t:`Washington D.C. passed an ordinance that prohibits young men between the ages of 14 and 20 to be out after 10:00 in the evening unless accompanied by a female. The ordinance purports to \u201creduce incidents of violence among male gang members.\u201d\n\nSean is a 17-year-old male who filed suit in federal court to strike down the ordinance as unconstitutional after he was fined for being out alone at 10:30 at night.\n\nShould the court find the D.C. ordinance constitutional?`,
o:["No, unless Washington D.C. can show that the ordinance is substantially related to important government objectives.","Yes, if D.C. can show a rational relationship between the ordinance and maintaining order.","Yes, because in these situations the government is performing a parens patriae function.","No, if Sean can show that the ordinance was not necessary to promote a compelling government interest."],a:0,
e:"The ordinance classifies by gender (only young men are restricted), which triggers intermediate scrutiny under Craig v. Boren. The government must show the classification is substantially related to an important government objective. Rational basis (B) is too low a standard for gender classifications. Strict scrutiny/compelling interest (D) is too high — that's for suspect classes like race. Parens patriae (C) doesn't override the Equal Protection analysis."},

{c:"Class 24",q:"Q2",t:`A Washington, D.C. employment practice requires fewer push-ups for women than for men in the physical exam to become a firefighter. Firefighters in Washington D.C. have filed a lawsuit alleging that the employment practice violates equal protection. Counsel for Washington D.C. argued that plaintiffs must demonstrate a more serious denial of equal protection than would be necessary if the state of Virginia were the defendant.\n\nWhat is plaintiffs\u2019 strongest argument in response?`,
o:["The equal protection analysis is only slightly higher when federal government acts rather than state government acts are being challenged.","The equal protection analysis is dedicated to the discretion of the Court when federal government acts rather than state government acts are being challenged.","The equal protection analysis is lower when federal government acts rather than state government acts are being challenged.","The equal protection analysis is the same whether federal or state government acts are being challenged."],a:3,
e:"Under Bolling v. Sharpe (1954), the Supreme Court held that the federal government is bound by equal protection principles through the Fifth Amendment's Due Process Clause, even though the Equal Protection Clause technically applies only to states. The Court has made clear that the equal protection analysis is the same regardless of whether the government actor is federal or state. D.C.'s argument that a higher standard applies is incorrect."},

// ─── CLASS 25 ───
{c:"Class 25",q:"Q1",t:`The State of New York has a retirement system under which a fixed percentage of an employee\u2019s pay is deducted each payday. Retirement benefits are paid at age 65 for the life of the employee. New York has obtained reliable actuarial statistics that indicate that those who completely abstain from alcohol have a greater life expectancy than those who use alcohol. Those who abstain, therefore, receive smaller monthly retirement benefits than those who use alcohol. Tina Teetotaler has never had a drop of alcohol in her life, and challenges the lower benefit standard applicable to persons in her class on constitutional grounds.\n\nWhat would be the appropriate burden of proof?`,
o:["Tina must show that the benefit standard is not rationally related to a legitimate state purpose","Tina must show that the benefit standard is not necessary to achieve a compelling state interest.","New York must show that the benefit standard is necessary to achieve a compelling state interest.","New York must show that the benefit standard is rationally related to a legitimate state interest."],a:0,
e:"Alcohol consumption habits do not involve a suspect class or a fundamental right, so rational basis review applies. Under rational basis review, the burden falls on the challenger (Tina) to show there is no rational relationship between the classification and a legitimate government purpose. The state does not bear the burden under rational basis — the challenger does. The actuarial distinction here would likely survive rational basis review since it is based on real statistical differences in life expectancy."},

{c:"Class 25",q:"Q2",t:`An Arizona statute required all persons operating a catering business within the state to be licensed by the Arizona Board of Health. Applicants can only receive licenses if they have lived in Arizona for at least 5 years and are United States citizens. Jessica has lawfully resided in Arizona for several years but is not a United States citizen; she challenges the requirement that applicants for licenses must be United States citizens.\n\nThis provision is most likely:`,
o:["Unconstitutional, as a denial of equal protection","Constitutional, as an effort to protect the health and welfare of Arizona residents.","Constitutional, as an exercise of Arizona\u2019s police power.","Unconstitutional, as a violation of freedom to contract."],a:0,
e:"Under Graham v. Richardson and its progeny, alienage is a suspect classification when states discriminate against lawful residents. State laws that discriminate based on alienage are subject to strict scrutiny — the state must show the classification is necessary to achieve a compelling interest. Operating a catering business is a private economic activity, not a governmental function, so the 'political function' exception does not apply. The citizenship requirement likely fails strict scrutiny and violates equal protection."},

{c:"Class 25",q:"Q3",t:`Sylvia, a non-citizen, lawfully resided in the United States for several years. She was browsing an online website for government employment opportunities and saw an opening for a position as a computer science teacher at the local public high school. She decided to apply for the position and was granted an interview. At the interview, Sylvia was informed that although her application had complied with all the requirements necessary for the position, she was disqualified from service solely because she was not a U.S. citizen. Sylvia brought an action for declaratory relief, claiming that the state has violated her rights under the Fourteenth Amendment.\n\nIs Sylvia likely to be successful in her action?`,
o:["No, because serving as a public educator is integral to the self-government process","Yes, because Sylvia\u2019s application complied with all the requirements necessary for the position.","Yes, because the state has not shown the classification restricting documented non-citizens is necessary to achieve a compelling interest.","No, because the state may discriminate against documented non-citizens where the justification is rationally related to a legitimate interest."],a:0,
e:"Under the 'political function' exception established in Foley v. Connelie and Ambach v. Norwick, states may require citizenship for positions that are integral to the process of self-government. Public school teachers fall into this category because they shape civic values, influence young minds, and serve a role closely tied to democratic governance. Therefore, the citizenship requirement for public school teachers is constitutional and Sylvia's challenge will likely fail."},

{c:"Class 25",q:"Q4",t:`The town of Stars Hollow has many parks, as well as a country club with a swimming pool. While Stars Hollow\u2019s parks are accessible to all without a fee, it charges a $700 application fee and $100 per month dues to belong to the country club and access the swimming pool. Lorelai, a Stars Hollow resident, wishes to join the country club but cannot afford the application fee or monthly dues.\n\nIf Lorelai sues Stars Hollow on the ground that the fee and dues discriminate against the poor in violation of the Equal Protection Clause, is she likely to prevail?`,
o:["No, because such discrimination against the poor has not been held to violate the Equal Protection Clause.","Yes, because Stars Hollow cannot deprive a public right or benefit on the basis of inability to pay.","Yes, because the poor qualify as a protected class.","No, because the membership privilege is not an important enough deprivation."],a:0,
e:"The Supreme Court has not recognized wealth/poverty as a suspect or quasi-suspect classification. In San Antonio Independent School District v. Rodriguez, the Court refused to treat wealth as a suspect class. Under rational basis review, the town's fee structure for a recreational amenity (not a fundamental right) would likely be upheld. The poor are not a protected class (C is wrong), and the analysis doesn't turn on whether the deprivation is 'important enough' (D)."},

// ─── FINAL REVIEW ───
{c:"Final Review",q:"Q1",t:`To prevent the Supreme Court from whittling away the protections that previous Supreme Court decisions had created for individuals accused of crimes, Congress passed a law eliminating from Supreme Court jurisdiction all cases in which a state supreme court has decided that a defendant\u2019s federal constitutional rights have been violated.\n\nIf the statute is held unconstitutional, what is the most likely reason?`,
o:["The determination of the extent of constitutional rights is precisely the domain of the Supreme Court.","Congress\u2019s power to limit jurisdiction applies only to cases originating in the federal courts","To be effective, the action taken by Congress here would require a constitutional amendment.","Congress may not eliminate all avenues for Supreme Court review of issues vested within the judicial power of the federal courts."],a:3,
e:"While Congress has some power to regulate the Supreme Court's appellate jurisdiction under Article III, \u00a72 (the Exceptions Clause), it cannot use this power to destroy the essential role of the judiciary. Completely eliminating Supreme Court review of federal constitutional questions would undermine the judicial power vested by Article III and the supremacy of federal law. Congress cannot strip all avenues of review for issues within the federal judicial power."},

{c:"Final Review",q:"Q2",t:`A new federal law prohibited the use of various pesticides in areas with a certain population density near navigable waters. A city located in the southeastern United States was plagued by a sharp increase in disease-carrying mosquitoes. The city\u2019s board of health recommended that all residential areas be sprayed with a pesticide proven to be highly effective against mosquitoes. Despite the fact that the federal law would prohibit use of that pesticide in these areas, the city council passed an ordinance adopting the board of health plan, relying on the opinions of several independent experts that the health benefits of reducing the mosquito population outweighed the risks of spraying. An environmentally minded citizen of the city brought an action in federal court challenging the ordinance.\n\nAssuming that the citizen has standing, is the court likely to find the ordinance valid?`,
o:["Yes, because pursuant to the police power, cities have a compelling interest in laws designed to protect the health, safety, and welfare of their citizens.","Yes, because controlling health hazards is an integral governmental function.","No, because it is superseded by the power of Congress to adopt laws to protect the health, safety, and welfare of citizens.","No, because it conflicts with a federal law that Congress had the power to make under the Commerce Clause."],a:3,
e:"Under the Supremacy Clause (Article VI), when a valid federal law conflicts with a state or local law, the federal law prevails. The federal pesticide ban was enacted under Congress's Commerce Clause power (regulating pesticides near navigable waters). The city ordinance directly contradicts this federal law. Regardless of the city's health rationale, a local ordinance cannot override a valid federal statute. The police power (A) and integral function (B) arguments cannot overcome federal preemption."},

{c:"Final Review",q:"Q3",t:`Congress wishes to enact legislation prohibiting discrimination in the sale or rental of housing on the basis of the sexual orientation of the potential purchaser or renter. Congress wants this statute to apply to all public and private vendors and lessors of residential property in this country, with a few narrowly drawn exceptions.\n\nWhich of the following provides the strongest basis for enactment of this legislation by Congress?`,
o:["The General Welfare Clause, because the conduct the statute prohibits could reasonably be deemed to be harmful to the national interest.","The Commerce Clause, because the sale or rental of almost all housing in aggregate could reasonably be deemed to have a substantial effect on interstate commerce.","The enabling clause of the Thirteenth Amendment, because that amendment prohibits discrimination against badges of past discrimination.","The enabling clause of the Fourteenth Amendment, because that amendment prohibits public and private actors from engaging in discrimination."],a:1,
e:"The Commerce Clause is the strongest basis because the sale and rental of housing, taken in the aggregate, has a substantial effect on interstate commerce (similar to the reasoning in Heart of Atlanta Motel and the Fair Housing Act). The General Welfare Clause (A) is a limitation on the taxing/spending power, not an independent grant of regulatory power. The Thirteenth Amendment (C) has been used for racial discrimination but its application to sexual orientation is untested. The Fourteenth Amendment (D) applies only to state action, not private actors."},

{c:"Final Review",q:"Q4",t:`A special prosecutor was appointed to investigate allegations that a presidential aide accepted bribes to secure the appointment of certain federal judges. The special prosecutor has subpoenaed all memoranda written by the aide on the subject of judicial nominations to vacancies. The President has government attorneys move to quash the subpoena on the ground of executive privilege.\n\nHow should the trial judge rule on the motion?`,
o:["Deny the motion, because the President has no greater privilege in this matter than any other officer of the government","Deny the motion, because although there is a presumption of a privilege, it can be overcome by a strong showing of the needs of the criminal justice system.","Grant the motion, because executive privilege is an absolute bar to the requested information, except in the case of an impeachment of the President.","Grant the motion, because executive privilege is an absolute bar to the requested information, as the President is entitled to confidential advice from subordinates."],a:1,
e:"In United States v. Nixon (1974), the Supreme Court recognized executive privilege as a constitutionally based presumption but held it is not absolute. When there is a demonstrated, specific need for evidence in a criminal proceeding, the privilege must yield. The Court balanced the President's interest in confidentiality against the needs of the criminal justice system and found that the needs of justice can overcome the presumptive privilege."},

{c:"Final Review",q:"Q5",t:`A state adopted legislation making it a crime to be the biological parent of more than two children. The stated purpose of the statute is to preserve the state\u2019s natural resources and improve the quality of life for the state\u2019s residents. A married couple has just had their third child. They have been arrested and convicted under the statute.\n\nWhich of the following is the strongest argument for voiding the convictions of the couple?`,
o:["The statute is an invalid exercise of the state\u2019s police power because there is no rational basis for concluding that the challenged statute would further the government\u2019s stated interests","The statute places an unconstitutional burden on the fundamental privacy interests of married persons.","The statute places too much discretion in state officials to determine who will be permitted to bear children.","The statute denies married persons equal protection of law."],a:1,
e:"The right to procreate has been recognized as a fundamental right (Skinner v. Oklahoma, Griswold v. Connecticut). Laws that burden fundamental rights are subject to strict scrutiny. A criminal prohibition on having more than two children directly and severely burdens the fundamental right to make intimate family decisions about procreation. This is a much stronger argument than rational basis (A), vagueness (C), or equal protection (D) because the law strikes at the core of reproductive liberty."},

{c:"Final Review",q:"Q6",t:`A state legislature passed a statute denying in-state tuition rates at any state-supported college or university for any resident aliens who were citizens of \u201cany country which, during the previous five-year period, has held citizens of the United States as hostages.\u201d Before becoming a resident alien of the state three years ago, the plaintiff had been a citizen of a country that had held United States citizens as hostages. Prior to passage of the statute, he had been enrolled for two years at the state university and had qualified for the in-state tuition rates because he was a resident of the state. The registrar of the university has informed the plaintiff that he no longer qualifies for the in-state tuition rate, and he cannot afford to pay the nonresident tuition.\n\nIf the plaintiff files an appropriate suit asking the federal courts to strike down the state statute, which of the following is his best argument?`,
o:["Because higher education is now so important for earning a livelihood, it has become a fundamental right protected by the Privileges or Immunities Clause of the Fourteenth Amendment.","Resident aliens cannot be blamed in retrospect for actions of their governments and, therefore, the state statute violates the constitutional prohibition of ex post facto laws.","Alienage is a suspect category under the Equal Protection Clause of the Fourteenth Amendment, and the state has not met the appropriate standard to burden the plaintiff.","Attending a state-supported university in a state where one is a legal resident is a property right that may not be taken away without due process of law."],a:2,
e:"Under Graham v. Richardson, alienage is a suspect classification, and state laws discriminating against lawful resident aliens are subject to strict scrutiny. The state must show the classification is necessary to serve a compelling interest. Punishing individual resident aliens for the actions of their home country's government is unlikely to survive strict scrutiny. Education is not a fundamental right (A is wrong per Rodriguez), ex post facto applies to criminal laws (B is inapplicable), and the due process property argument (D) is weaker than the equal protection claim."},

{c:"Final Review",q:"Q7",t:`A state provided for a public school system based primarily on property tax revenues from the various districts. School districts that had a property tax base below a certain threshold received supplemental funds from the state that were derived from state lottery revenues. The school districts receiving the supplemental funds served a predominantly Hispanic population as compared to the school districts funded only from property tax revenues.\n\nTo help balance its budget this year, the state legislature passed a statute terminating the supplemental funds program and earmarking the lottery revenues for deficit reduction. A group of parents of Hispanic schoolchildren in one of the school districts formerly receiving supplemental funds filed suit in federal court, alleging that the state\u2019s action in terminating the funding violates the Equal Protection Clause of the Fourteenth Amendment.\n\nWhich of the following best describes the appropriate standard by which the court should review the constitutionality of the state action?`,
o:["Because the state statute results in discrimination against a suspect class, the state will have to demonstrate that the statute is necessary to vindicate a compelling state interest.","Because the right to education burdened by the statute is not a fundamental right, the parents will have to demonstrate that the statute is not substantially related to an important state interest.","Because no suspect class or fundamental right is improperly burdened in this case, the parents will have to demonstrate that the statute is not rationally related to any legitimate state interest.","Because the state statute is not discriminatory in intent, the state will have to demonstrate only that the statute is rationally related to a legitimate state interest."],a:2,
e:"Two key principles apply: (1) Education is not a fundamental right (San Antonio v. Rodriguez), and (2) the statute has a disparate impact on Hispanic students but is not facially discriminatory — under Washington v. Davis, disparate impact alone without discriminatory intent does not trigger strict scrutiny. Since neither a suspect class is intentionally targeted nor a fundamental right is burdened, rational basis review applies, and the burden falls on the challengers to show there is no rational relationship to a legitimate state interest."},
];

  });
  c.innerHTML=h;sel.fill(-1);upd();
}
function s(i,j){

  Q[i].o.forEach((_,k)=>document.getElementById('o'+i+'_'+k).classList.remove('sel'));

function go(i){

  const d=document.getElementById('qc'+i);
  if(d.classList.contains('ok')||d.classList.contains('no'))return;
  const bs=d.querySelectorAll('.ob'),fb=document.getElementById('fb'+i),sb=document.getElementById('sb'+i),ex=document.getElementById('ex'+i);
  bs.forEach(b=>{b.classList.add('lk');b.classList.remove('sel')});
  sb.disabled=true;sb.style.display='none';

  } else {

  ex.innerHTML=q.e;ex.classList.add('sh');

}
function upd(){
  document.getElementById('sC').textContent=ok;
  document.getElementById('sW').textContent=no;
  document.getElementById('sR').textContent=tot-ok-no;
}
function reset(){ok=0;no=0;render();window.scrollTo({top:0,behavior:'smooth'})}
render();
</script>
