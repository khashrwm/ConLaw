<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criminal Law — Master Crime List</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    min-height: 100vh;
    color: #e2e8f0;
  }

  .header {
    background: linear-gradient(180deg, rgba(220,38,38,0.12) 0%, transparent 100%);
    border-bottom: 1px solid rgba(220,38,38,0.25);
    padding: 36px 24px 28px;
    text-align: center;
  }

  .header-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #94a3b8;
    margin-bottom: 8px;
  }

  .header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 30px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .header-count {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 22px;
  }

  .search-wrap {
    max-width: 420px;
    margin: 0 auto;
  }

  .search-wrap input {
    width: 100%;
    padding: 11px 16px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #e2e8f0;
    font-size: 14px;
    font-family: 'Source Serif 4', Georgia, serif;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus {
    border-color: #475569;
  }

  .search-wrap input::placeholder {
    color: #475569;
  }

  .content {
    padding: 20px 16px 50px;
    max-width: 740px;
    margin: 0 auto;
  }

  .category {
    margin-bottom: 10px;
  }

  .cat-btn {
    width: 100%;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid #334155;
    border-radius: 8px;
    cursor: pointer;
    color: #f1f5f9;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: left;
    transition: background 0.2s;
  }

  .cat-btn:hover {
    background: rgba(51, 65, 85, 0.5);
  }

  .cat-btn.open {
    background: rgba(51, 65, 85, 0.6);
    border-radius: 8px 8px 0 0;
  }

  .cat-btn .count {
    font-size: 11px;
    color: #64748b;
    font-weight: 400;
  }

  .cat-btn .toggle {
    font-size: 18px;
    color: #64748b;
  }

  .cat-body {
    border: 1px solid #334155;
    border-top: none;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
    display: none;
  }

  .cat-body.open {
    display: block;
  }

  .crime {
    border-bottom: 1px solid rgba(51, 65, 85, 0.5);
  }

  .crime:last-child {
    border-bottom: none;
  }

  .crime-btn {
    width: 100%;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(15, 23, 42, 0.4);
    border: none;
    cursor: pointer;
    color: #e2e8f0;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 15px;
    font-weight: 600;
    text-align: left;
    transition: background 0.15s;
  }

  .crime-btn:hover {
    background: rgba(30, 41, 59, 0.6);
  }

  .crime-btn.open {
    background: rgba(30, 41, 59, 0.8);
  }

  .crime-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    opacity: 0.8;
  }

  .crime-arrow {
    font-size: 14px;
    color: #475569;
    transition: transform 0.15s;
    margin-left: auto;
  }

  .crime-btn.open .crime-arrow {
    transform: rotate(90deg);
  }

  .crime-detail {
    padding: 4px 16px 18px 36px;
    background: rgba(15, 23, 42, 0.6);
    display: none;
  }

  .crime-detail.open {
    display: block;
  }

  .detail-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.9;
  }

  .crime-detail ol {
    margin: 0 0 14px 0;
    padding-left: 18px;
    line-height: 1.75;
  }

  .crime-detail ol li {
    font-size: 13.5px;
    color: #cbd5e1;
    margin-bottom: 2px;
  }

  .crime-notes {
    font-size: 12.5px;
    color: #94a3b8;
    line-height: 1.65;
    padding: 10px 12px;
    background: rgba(30, 41, 59, 0.5);
    border-radius: 6px;
  }

  .no-results {
    text-align: center;
    padding: 40px;
    color: #475569;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-sub">Criminal Law Final Review</div>
  <h1>Master Crime List</h1>
  <div class="header-count"><span id="totalCount"></span> crimes &amp; defenses · Elements for memorization</div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search crimes, elements, or notes..." autocomplete="off">
  </div>
</div>

<div class="content" id="content"></div>

<script>
const crimes = [
  {
    category: "HOMICIDE",
    items: [
      {
        name: "First Degree Murder",
        elements: [
          "Intentional killing",
          "Of a human being",
          "With premeditation (some thought before acting)",
          "And deliberation (conscious choice to kill)"
        ],
        notes: "Carroll: seconds enough for P+D. Anderson (CA): needs planning + motive + manner. Max: life without parole or death.",
        color: "#DC2626"
      },
      {
        name: "Felony Murder (1st Degree)",
        elements: [
          "Commission of (or attempt to commit) an inherently dangerous felony (BREAKRSS)",
          "Unintentional killing occurs during or in flight from the felony",
          "Causal connection between felony and death",
          "Mens rea transferred from the felony intent"
        ],
        notes: "BREAKRSS: Burglary, Robbery, Escape, Arson, Kidnapping, Rape, Sodomy, Serious Sex Crimes. Strict liability for the killing. Limitations: inherently dangerous, independent felonious purpose, merger doctrine, agency theory (~75%), proximate cause, time period, in furtherance.",
        color: "#DC2626"
      },
      {
        name: "Second Degree Murder",
        elements: [
          "Intentional killing WITHOUT premeditation and deliberation",
          "OR recklessness + extreme indifference to human life ('depraved heart')",
          "OR intent to inflict great bodily harm resulting in death"
        ],
        notes: "Malone (Russian Roulette): gross recklessness = malice. MPC: extreme recklessness manifesting extreme indifference to value of human life.",
        color: "#EA580C"
      },
      {
        name: "Voluntary Manslaughter (Heat of Passion)",
        elements: [
          "Intentional killing",
          "Committed under influence of passion / heat of blood",
          "Adequate or reasonable provocation",
          "Before reasonable time to cool off",
          "Resulting in temporary loss of self-control"
        ],
        notes: "Girouard (majority): only recognized categories (battery, mutual combat, adultery discovery). Maher (minority): anything that would provoke a reasonable person → jury decides. Words alone generally insufficient.",
        color: "#F59E0B"
      },
      {
        name: "Involuntary Manslaughter",
        elements: [
          "Unintentional killing",
          "Caused by criminal negligence or recklessness",
          "(or) during commission of an unlawful act (misdemeanor-manslaughter rule)"
        ],
        notes: "Welansky: 'wanton and reckless' = grave danger apparent + chose to run the risk. Williams: ordinary negligence sufficient in some jurisdictions (WA, since repealed). MPC splits into manslaughter (recklessness) and negligent homicide.",
        color: "#EAB308"
      },
      {
        name: "Negligent Homicide (MPC)",
        elements: [
          "Unintentional killing",
          "Defendant should have been aware of substantial and unjustifiable risk",
          "Gross deviation from standard of care of a reasonable person"
        ],
        notes: "Lesser than manslaughter under MPC. Person should have known but didn't (vs. recklessness where person consciously disregards).",
        color: "#CA8A04"
      },
      {
        name: "Misdemeanor-Manslaughter",
        elements: [
          "Commission of an unlawful act (misdemeanor)",
          "That act caused someone's death",
          "Proximate cause between act and death"
        ],
        notes: "Limitations: proximate cause required, some courts limit to malum in se offenses, some require dangerousness. Commonwealth v. Williams: expired license didn't cause crash.",
        color: "#CA8A04"
      }

  },
  {
    category: "INCHOATE CRIMES",
    items: [
      {
        name: "Attempt",
        elements: [
          "Specific intent (purpose) to commit the target crime",
          "A substantial step toward commission (MPC) OR act tending to effect commission (common law proximity test)",
          "Failure to complete the crime"
        ],
        notes: "Rizzo: proximity test — must come very near to accomplishment. Jackson: substantial step + strongly corroborative of criminal intent. Mens rea is always intent/purpose, even if completed crime only requires recklessness. Abandonment defense (MPC): voluntary and complete renunciation.",
        color: "#7C3AED"
      },
      {
        name: "Solicitation",
        elements: [
          "Intentionally encouraging, requesting, or commanding another",
          "To commit a crime",
          "With purpose that the crime be committed"
        ],
        notes: "Davis: solicitation alone not attempt. Church: solicitation + detailed planning + payment = attempt. Independent crime under MPC §5.02. Crime is complete upon the asking — no need for the other person to agree or act.",
        color: "#7C3AED"
      },
      {
        name: "Conspiracy",
        elements: [
          "Agreement between two or more persons (bilateral) or by the defendant (unilateral/MPC)",
          "To commit a crime",
          "Intent that the target crime be committed",
          "Overt act in furtherance of the agreement (most jurisdictions)"
        ],
        notes: "Does NOT merge into completed crime (unlike attempt). Pinkerton: co-conspirators liable for foreseeable crimes in furtherance. Wharton's Rule: can't charge conspiracy when crime inherently requires 2+ people. Kotteakos: hub-and-spoke needs a 'rim.' Bruno: chain conspiracy = one conspiracy if each link knows others exist + community of interest.",
        color: "#7C3AED"
      }
    ]
  },
  {
    category: "PROPERTY & OTHER SPECIFIC CRIMES",
    items: [
      {
        name: "Larceny",
        elements: [
          "Intentional taking",
          "And carrying away (asportation)",
          "Of the property of another",
          "With further intent to deprive the owner permanently (or unreasonably long time)"
        ],
        notes: "Specific intent crime (double intent). The 'further intent' to permanently deprive distinguishes it from trespass.",
        color: "#2563EB"
      },
      {
        name: "Robbery",
        elements: [
          "Larceny (taking + carrying away + property of another + intent to deprive)",
          "By force, fear, intimidation, threat, or violence",
          "Against a person (not just property)"
        ],
        notes: "Specific intent crime. Larceny + force = robbery. Crime against a person, not just property.",
        color: "#2563EB"
      },
      {
        name: "Burglary",
        elements: [
          "Intentional breaking and entering",
          "Of the dwelling/structure of another",
          "With intent to commit a crime once inside"
        ],
        notes: "Specific intent crime. Breaking + entering = general intent, but with intent to commit crime inside = specific intent. A 'crime in the nature of attempt.' Independent felonious purpose for felony murder analysis.",
        color: "#2563EB"
      },
      {
        name: "Arson",
        elements: [
          "Willful and malicious",
          "Burning of a structure/dwelling"
        ],
        notes: "Inherently dangerous felony for felony murder (BREAKRSS). Serne: putting people at risk by setting fire = murder if death results.",
        color: "#2563EB"
      },
      {
        name: "Assault",
        elements: [
          "An act creating a reasonable apprehension",
          "Of imminent harmful or offensive contact",
          "(OR) an attempted battery"
        ],
        notes: "Hood: treated as general intent for intoxication purposes. Assault with intent to kill/rape = specific intent.",
        color: "#2563EB"
      },
      {
        name: "Battery",
        elements: [
          "Unlawful application of force",
          "To the person of another",
          "Resulting in harmful or offensive contact"
        ],
        notes: "General intent crime. Often the completed form of assault.",
        color: "#2563EB"
      },
      {
        name: "Rape",
        elements: [
          "Sexual intercourse",
          "By force or threat of force",
          "Without consent of the victim"
        ],
        notes: "Sherry: mistake of consent not a defense; man proceeds at own peril. Fischer: mistake of fact re consent not a defense to IDSI. General intent crime (all modern jurisdictions). Physical resistance not required — any resistance showing lack of consent suffices. Mens rea debate: purpose (0), knowledge (10), recklessly (12), negligently (14).",
        color: "#2563EB"
      },
      {
        name: "Receiving Stolen Property",
        elements: [
          "Receiving property",
          "That has been stolen",
          "With knowledge that it was stolen"
        ],
        notes: "Jaffe: if property no longer stolen at time of receipt → legal impossibility (traditional). Knowledge element = actual knowledge, not mere belief.",
        color: "#2563EB"
      },
      {
        name: "Kidnapping",
        elements: [
          "Unlawful confinement or movement",
          "Of another person",
          "By force, threat, or deception"
        ],
        notes: "BREAKRSS felony for felony murder. Inherently dangerous.",
        color: "#2563EB"
      }
    ]
  },
  {
    category: "COMPLICITY & VICARIOUS LIABILITY",
    items: [
      {
        name: "Accomplice Liability (Aiding & Abetting)",
        elements: [
          "Intent that the crime be committed",
          "Acts of aiding, abetting, assisting, or facilitating the crime",
          "The principal commits (or attempts) the crime"
        ],
        notes: "Punished same as principal. Federal: aids, abets, counsels, commands, induces, or procures. Lauria: knowledge of criminal use ≠ intent to participate (for misdemeanors). For serious felonies, knowledge alone may suffice.",
        color: "#059669"
      },
      {
        name: "Accessory After the Fact",
        elements: [
          "Assist a person who has committed a crime",
          "After the crime has been committed",
          "With knowledge that the person committed the crime",
          "With intent to help avoid arrest or punishment"
        ],
        notes: "Lesser punishment than principal. Separate and distinct from accomplice liability.",
        color: "#059669"
      },
      {
        name: "Pinkerton Liability (Conspiracy-Based)",
        elements: [
          "Membership in an ongoing conspiracy",
          "Co-conspirator commits a substantive crime",
          "Crime falls within scope of conspiracy OR is reasonably foreseeable",
          "Crime committed in furtherance of the conspiracy"
        ],
        notes: "Vicarious liability WITHOUT personal participation. ~75% of jurisdictions. Rejected by MPC and NY (McGee). Alvarez: extended to unintended but foreseeable crimes during drug conspiracy.",
        color: "#059669"
      }
    ]
  },
  {
    category: "STRICT LIABILITY OFFENSES",
    items: [
      {
        name: "Strict Liability / Public Welfare Offenses",
        elements: [
          "Voluntary act (actus reus)",
          "That violates the statute",
          "NO mens rea required"
        ],
        notes: "Balint: narcotics at own peril. Dotterweich: mislabeled drugs. Morissette: common-law crimes (stealing) still require mens rea even if statute is silent. MPC: strict liability only for 'violations' (not crimes), punished by fines only, no imprisonment. Determining SL: words of statute, legislative history, maximum penalty.",
        color: "#6B7280"
      },
      {
        name: "Statutory Rape (Prince Principle)",
        elements: [
          "Sexual intercourse with a minor",
          "Under the statutory age",
          "Regardless of defendant's knowledge of age"
        ],
        notes: "Prince: mistake of fact about age not a defense when committing a morally wrong act. Lesser crime principle: if facts as believed would still be a crime, no defense. MPC disfavors strict liability but this remains an exception.",
        color: "#6B7280"
      }
    ]
  },
  {
    category: "DEFENSES (Quick Reference)",
    items: [
      {
        name: "Self-Defense (Justification)",
        elements: [
          "Resisting present or imminent unlawful force",
          "No more force than reasonably necessary",
          "Deadly force only against deadly danger",
          "Not the initial aggressor (exceptions: non-deadly aggressor facing deadly force, or withdrew)",
          "Duty to retreat (some jurisdictions; eliminated by Stand Your Ground)"
        ],
        notes: "Imperfect self-defense: honest but unreasonable belief → reduces to VM. BWS: admissible to explain perception but standard varies (objective, hybrid, subjective). Norman: sleeping abuser = no imminence. MPC: 'immediately necessary' (broader than 'imminent').",
        color: "#0891B2"
      },
      {
        name: "Necessity / Choice of Evils (Justification)",
        elements: [
          "Choice of evils — chose the lesser evil",
          "Acted to prevent imminent harm",
          "Direct causal relationship between conduct and harm averted",
          "No legal alternatives to violating the law",
          "Situation not caused by defendant's recklessness"
        ],
        notes: "Schoon: NEVER available for indirect civil disobedience. Cannot justify taking life of innocent person. Rarely successful. Conjunctive — failure on any element = no defense.",
        color: "#0891B2"
      },
      {
        name: "Duress (Excuse)",
        elements: [
          "Threat by another person (not circumstances)",
          "Reasonable fear of imminent death or serious bodily harm (common law) OR coercion a person of reasonable firmness couldn't resist (MPC)",
          "No reasonable opportunity to escape",
          "Not available for murder (common law); MPC allows it"
        ],
        notes: "Toscano: NJ adopted MPC broader standard. Distinction from necessity: duress = human threat (excuse), necessity = circumstances (justification). MPC: person of reasonable firmness in actor's situation.",
        color: "#0891B2"
      },
      {
        name: "Voluntary Intoxication (Partial Defense)",
        elements: [
          "Defendant was voluntarily intoxicated",
          "Intoxication negated the specific intent required for the crime"
        ],
        notes: "Roberts: admissible to negate specific intent (intent to kill). Hood: NOT admissible for general intent crimes (assault). MPC: admissible for purpose/knowledge, NOT for recklessness (getting drunk = conscious disregard). ~14 states bar entirely. Egelhoff: constitutional to exclude.",
        color: "#0891B2"
      },
      {
        name: "Insanity (Excuse)",
        elements: [
          "Mental disease or defect at time of the act",
          "PLUS (varies by test):",
          "M'Naghten: didn't know nature/quality of act OR didn't know it was wrong",
          "Irresistible Impulse: lost power to control actions",
          "Durham: act was product of mental disease (rarely used)",
          "MPC/ALI: lacked substantial capacity to appreciate criminality OR conform conduct to law"
        ],
        notes: "Burden varies: some on prosecution, some on defense (post-Hinckley). Federal law: basically M'Naghten + burden on defendant. 5 states abolished entirely. NGRI → hospital, not acquittal. Rarely used (~0.25% of cases), rarely successful.",
        color: "#0891B2"
      },
      {
        name: "Mistake of Fact",
        elements: [
          "Defendant held an honest (and sometimes reasonable) mistaken belief about a fact",
          "That negates the mens rea required for the crime"
        ],
        notes: "Specific intent: unreasonable mistake = defense. General intent: only reasonable mistake = defense. Strict liability: NO mistake defense. Morgan (overruled): unreasonable but honest belief once sufficed for rape (now general intent = need reasonable).",
        color: "#0891B2"
      },
      {
        name: "Mistake of Law",
        elements: [
          "Generally NOT a defense ('ignorance of the law is no excuse')",
          "Exception: Lambert — crime of omission + reasonable person wouldn't know about the law",
          "Exception: official reliance (due process — Raley v. Ohio)"
        ],
        notes: "Hopkins: reliance on state attorney advice not a defense. MPC: allows defense for minor regulatory offenses if relied on official statement, but only ONCE. Albertini: rely on latest ruling in your circuit.",
        color: "#0891B2"
      },
      {
        name: "Impossibility",
        elements: [
          "Pure Legal Impossibility: act is not a crime → ALWAYS a defense",
          "Factual Impossibility: crime fails due to external facts → NOT a defense",
          "Mixed Fact/Law: debated — defense in some jurisdictions, not in MPC"
        ],
        notes: "Jaffe: cloth not stolen = legal impossibility (defense). Dlugash: victim possibly dead = no defense under MPC §110.10. Oviedo: objective acts test (middle ground). Lady Eldon: true legal impossibility only when no crime exists on the books. MPC abolishes impossibility defense entirely.",

      },

        name: "Abandonment / Renunciation",
        elements: [
          "Voluntary and complete renunciation of criminal purpose",
          "Not motivated by increased risk of detection or difficulty",
          "Must be for the 'right reasons'"

        notes: "MPC §5.01(4). Johnston: abandoned because only $50 → not voluntary. McNeal: abducted girl then released → court said not voluntary. Ross: similar facts but court accepted defense.",
        color: "#0891B2"
      }
    ]
  },

    category: "FOUNDATIONAL CONCEPTS",
    items: [
      {
        name: "Actus Reus",
        elements: [
          "A voluntary physical act (or culpable omission where legal duty exists)"
        ],
        notes: "Martin: involuntary placement → no actus reus. Newton: unconsciousness negates voluntariness. Jones: omission requires legal duty (statute, relationship, contract, voluntary assumption of care).",
        color: "#475569"
      },
      {
        name: "Mens Rea (MPC Hierarchy)",
        elements: [
          "Purpose: conscious object to engage in conduct / cause result",
          "Knowledge: practically certain conduct will cause result",
          "Recklessness: consciously disregards substantial and unjustifiable risk",
          "Negligence: should have been aware of substantial and unjustifiable risk"
        ],
        notes: "Cunningham: 'maliciously' = intended harm or reckless as to whether harm occurs. Purpose/Knowledge = specific intent. Recklessness/Negligence = general intent.",
        color: "#475569"
      },

        name: "Legality Principle",
        elements: [
          "Nulla poena sine lege — no punishment without law",
          "Fair warning / notice",
          "No retroactivity (Ex Post Facto)",
          "No vague or overbroad statutes (Due Process)"
        ],
        notes: "Papachristou: vagrancy ordinance unconstitutional (no clear standards). McBoyle: airplane not a 'vehicle.' Cohen v. California: breach of peace too vague. Lambert: due process requires notice for omission crimes.",
        color: "#475569"
      },
      {
        name: "Proportionality (8th Amendment)",
        elements: [
          "Punishment must be proportional to the offense",
          "No cruel and unusual punishment"
        ],
        notes: "Coker: death for rape = disproportionate. Atkins: no death penalty for intellectually disabled. Roper: no death penalty for juveniles. Miller: no mandatory LWOP for juveniles. Rummel: three strikes upheld (controversial).",
        color: "#475569"
      }
    ]
  }
];

const totalCount = crimes.reduce((s, c) => s + c.items.length, 0);
document.getElementById('totalCount').textContent = totalCount;

let openCat = null;
let openCrime = null;

function render(searchTerm) {
  const container = document.getElementById('content');
  const q = (searchTerm || '').trim().toLowerCase();

  const filtered = q
    ? crimes.map(cat => ({
        ...cat,
        items: cat.items.filter(item =>
          item.name.toLowerCase().includes(q) ||
          item.elements.some(e => e.toLowerCase().includes(q)) ||
          item.notes.toLowerCase().includes(q)
        )
      })).filter(cat => cat.items.length > 0)
    : crimes;

  if (filtered.length === 0) {
    container.innerHTML = `<div class="no-results">No crimes found matching "${searchTerm}"</div>`;
    return;
  }

  let html = '';

  filtered.forEach((cat, catIdx) => {
    const catOpen = q || openCat === cat.category;

    html += `<div class="category">`;
    html += `<button class="cat-btn ${catOpen ? 'open' : ''}" onclick="toggleCat('${cat.category}')">
      <span>${cat.category} <span class="count">(${cat.items.length})</span></span>
      <span class="toggle">${catOpen ? '−' : '+'}</span>
    </button>`;

    html += `<div class="cat-body ${catOpen ? 'open' : ''}">`;

    cat.items.forEach((crime, crimeIdx) => {
      const key = `${catIdx}-${crimeIdx}`;
      const crimeOpen = q || openCrime === key;

      html += `<div class="crime">`;
      html += `<button class="crime-btn ${crimeOpen ? 'open' : ''}" onclick="toggleCrime('${key}', event)">
        <span class="crime-dot" style="background:${crime.color}"></span>
        <span style="flex:1">${crime.name}</span>
        <span class="crime-arrow">▸</span>
      </button>`;

      html += `<div class="crime-detail ${crimeOpen ? 'open' : ''}" id="detail-${key}">
        <div class="detail-label" style="color:${crime.color}">Elements</div>
        <ol>`;
      crime.elements.forEach(el => {
        html += `<li>${el}</li>`;
      });
      html += `</ol>
        <div class="crime-notes" style="border-left:3px solid ${crime.color}33">
          ${crime.notes}
        </div>
      </div>`;

      html += `</div>`;
    });

    html += `</div></div>`;
  });

  container.innerHTML = html;
}

function toggleCat(name) {
  openCat = openCat === name ? null : name;
  openCrime = null;
  render(document.getElementById('searchInput').value);
}

function toggleCrime(key, e) {
  e.stopPropagation();
  openCrime = openCrime === key ? null : key;
  render(document.getElementById('searchInput').value);
}

document.getElementById('searchInput').addEventListener('input', function() {
  openCat = null;
  openCrime = null;
  render(this.value);
});

render('');
</script>
</body>
</html>
